<title>Pie Second Ring Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: a guided walkthrough. One instruction card on top says what to do now; the arena
   below shows a start circle and a dotted arrow for the next stroke; results appear at the end.
   Deliberately single-theme dark: the neon wireframe is drawn for a terminal background. */
:root {
  color-scheme: dark;
  --bg: #0a0d12; --q-bg: #0d1117; --q-panel: #161b22; --q-line: #30363d;
  --fg: #c9d1d9; --muted: #8b949e; --hi: #f0f6fc; --blue: #58a6ff; --green: #3fb950; --red: #f85149; --amber: #d29922; --guide: #ffd60a;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: Inter, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--body); padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; color: var(--hi); text-wrap: balance; }
h1 { font-size: 24px; } h2 { font-size: 20px; } h3 { font-size: 15px; }
p { margin: 0; max-width: 75ch; }
.tag { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.m { color: var(--muted); }

.card { border: 1px solid var(--blue); background: #0f1a2a; border-radius: 10px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.card .step { font: 500 12px var(--mono); letter-spacing: .06em; color: var(--blue); text-transform: uppercase; }
.card ul, .card ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; max-width: 75ch; }
.go { align-self: flex-start; border: 0; background: var(--blue); color: #04111f; font-weight: 600; border-radius: 6px; padding: 9px 18px; }
.rate { display: flex; flex-wrap: wrap; gap: 8px; }
fieldset.rate { border: 0; padding: 0; margin: 0; min-width: 0; }
.rate input { position: absolute; opacity: 0; pointer-events: none; }
.rate label { border: 1px solid var(--q-line); background: var(--q-panel); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
.rate input:checked + label { border-color: var(--blue); background: #132339; color: #fff; }
.rate input:focus-visible + label { outline: 2px solid var(--blue); outline-offset: 2px; }
textarea { width: 100%; box-sizing: border-box; background: var(--q-bg); color: var(--fg); border: 1px solid var(--q-line); border-radius: 6px; font: 13px var(--body); padding: 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--q-panel); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .2s; }

.arena { position: relative; height: 560px; border: 1px solid var(--q-line); border-radius: 8px; overflow: hidden; background: var(--q-bg);
  touch-action: none; user-select: none; cursor: crosshair; }
.arena.off { cursor: default; }
.target { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); text-align: center; pointer-events: none;
  border: 1px solid var(--q-line); background: rgba(13,17,23,.92); border-radius: 8px; padding: 6px 18px; max-width: calc(100% - 24px); }
.target small { display: block; font: 11px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.target b { display: block; font: 700 17px var(--mono); letter-spacing: .06em; color: #fff; }
.fb { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font: 600 14px var(--mono); padding: 5px 14px; border-radius: 14px;
  background: rgba(13,17,23,.92); border: 1px solid var(--q-line); pointer-events: none; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.fb.ok { color: var(--green); border-color: var(--green); } .fb.bad { color: var(--red); border-color: var(--red); } .fb.idle { color: var(--muted); font-weight: 400; }
.layer { position: absolute; width: 460px; height: 460px; margin: -230px 0 0 -230px; pointer-events: none; }
.layer svg { width: 100%; height: 100%; overflow: visible; }
.layer text { font-family: var(--mono); text-anchor: middle; dominant-baseline: middle; }
#guide { left: 50%; top: 50%; }
.start { fill: none; stroke: var(--guide); stroke-width: 1.5; stroke-dasharray: 4 4; }
.start-t { font-size: 10px; fill: var(--guide); letter-spacing: .08em; }
.gpath { fill: none; stroke: var(--guide); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 9; animation: march 0.7s linear infinite; }
.ghead { fill: var(--guide); }
.gwait { fill: none; stroke: var(--guide); stroke-width: 2; }
.gwait-t { font-size: 10px; fill: var(--guide); font-weight: 700; letter-spacing: .08em; }
@keyframes march { to { stroke-dashoffset: -11; } }
#pm svg { animation: pop .11s ease-out; transform-origin: center; }
.spin { animation: spin 16s linear infinite; transform-origin: 0 0; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes dwell { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .spin, #pm svg, .gpath { animation: none; } }

/* Neon wireframe, spectrum palette: --a is the resting line, --b the aimed line */
.wire { --a: #7df9ff; --b: #ffffff; }
.wire .sg { --a: hsl(calc(var(--h) * 45 + 170) 100% 62%); }
.wire text { paint-order: stroke; stroke: #0d1117; stroke-width: 3px; stroke-linejoin: round; }
.wire .line { fill: none; stroke: var(--a); }
.wire .glow { filter: drop-shadow(0 0 2px var(--a)) drop-shadow(0 0 8px var(--a)); }
.wire .s { fill: none; stroke: var(--a); stroke-width: 1.1; filter: drop-shadow(0 0 4px var(--a)); }
.wire .s.on { stroke: var(--b); stroke-width: 2.2; filter: drop-shadow(0 0 3px var(--b)) drop-shadow(0 0 11px var(--a)); }
.wire .s.sel { fill: color-mix(in srgb, var(--a) 40%, transparent); }
.wire .s.c { stroke-width: 1; }
.wire .s2 { fill: none; stroke: var(--b); stroke-width: .7; stroke-dasharray: 2 3; }
.wire .v { fill: var(--a); }
.wire .tab { fill: none; stroke: var(--a); stroke-width: 2; filter: drop-shadow(0 0 4px var(--a)); }
.wire .spoke { stroke: var(--a); stroke-width: .8; stroke-dasharray: 2 3; fill: none; }
.wire .gh { stroke: var(--a); stroke-width: 1; opacity: .55; fill: none; }
.wire .ght { font-size: 8px; fill: var(--a); opacity: .7; letter-spacing: .06em; }
.wire .l { font-size: 9.5px; letter-spacing: .1em; fill: var(--a); }
.wire .l.on { fill: #fff; font-weight: 700; }
.wire .k { font-size: 8px; fill: var(--a); opacity: .7; }
.wire .big { font-size: 12px; font-weight: 700; fill: #fff; letter-spacing: .08em; }
.wire .sm { font-size: 8.5px; fill: #c9d1d9; letter-spacing: .08em; }
.wire .trail { fill: none; stroke: #fff; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 1 4; opacity: .6; }
.wire .dwell { fill: none; stroke: #fff; stroke-width: 2; stroke-dasharray: 75.4; stroke-dashoffset: 75.4; animation: dwell linear forwards;
  transform-box: fill-box; transform-origin: center; transform: rotate(-90deg); filter: drop-shadow(0 0 4px #7df9ff); }

.tablewrap { overflow-x: auto; border: 1px solid var(--q-line); border-radius: 8px; background: var(--q-panel); }
table { border-collapse: collapse; width: 100%; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--q-line); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; }
tbody tr:last-child td { border-bottom: 0; }
td.best { color: var(--green); font-weight: 700; }
.ghost { border: 1px solid var(--q-line); background: var(--q-panel); border-radius: 6px; padding: 6px 12px; }
details summary { cursor: pointer; color: var(--muted); }
#csv { min-height: 120px; font: 12px var(--mono); }
</style>

<div class="wrap">
  <header>
    <div class="tag">Throwaway prototype · about 5 minutes · needs a mouse</div>
    <h1>Pie Second Ring Test</h1>
  </header>

  <section class="card" id="card" aria-live="polite"></section>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>

  <div class="arena off" id="arena" aria-label="Stroke area. Hold the right mouse button inside the yellow circle, drag along the arrow, and let go.">
    <div id="guide" class="layer"></div>
    <div id="pm" class="layer" hidden></div>
    <div class="target" id="target" hidden><small id="target-kind"></small><b id="target-name"></b></div>
    <div class="fb idle" id="fb"></div>
  </div>

  <section id="results" hidden>
    <h2>Results</h2>
    <div class="tablewrap" id="table"></div>
    <details>
      <summary>Every stroke, as CSV</summary>
      <label for="csv" class="m">Select all and copy if you want the raw data.</label>
      <textarea id="csv" readonly></textarea>
    </details>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const ITEMS = [
  { label: "Merge", key: "M", kids: ["Squash", "Commit", "Rebase"] },
  { label: "Files", key: "F" },
  { label: "Comment", key: "C" },
  { label: "Widen", key: "W" },
  { label: "Palette", key: "P" },
  { label: "Split", key: "S", kids: ["Side", "Stack", "Grid"] },
  { label: "New term", key: "N", kids: ["Claude", "Codex", "Pwsh"] },
  { label: "Next wait", key: "Q" },
];
// Sub-action directions relative to the parent's direction, in degrees clockwise.
const LAYOUT = { turn: [-90, 180, 90], pause: [-45, 0, 45] };
const TECH = {
  dist: { name: "Distance", layout: null, turn: false, pause: false,
    how: "Drag toward the action and keep going, past the edge of the menu. Three narrow slices appear on an outer ring; finish on the one you want. This is the version you saw before." },
  turn: { name: "Turn", layout: "turn", turn: true, pause: false, preview: true,
    how: "Drag toward the action, then make a sharp turn: left, back toward the centre, or right. The direction of the turn picks the choice. No waiting." },
  pause: { name: "Pause", layout: "pause", turn: false, pause: true,
    how: "Drag toward the action and hold still for a moment. A ring fills up, then the choices fan out ahead of you. Keep going straight, or angle a little left or right." },
  classic: { name: "Turn or pause", layout: "turn", turn: true, pause: true,
    how: "Same moves as Turn. If you are unsure, you can also stop and hold still for a moment to see the choices first, then turn." },
};
const DEAD = 26, OUTER = 132, CORNER_MIN = 40, TURN_LEG = 22, TURN_DEV = 45, STILL_PX = 7, KID_MIN = 20, DWELL = 300;
const PRACTICE = 6, MEASURED = 15, START_R = 44;

const S = { tech: "dist", open: false, drag: false, btn: -1, cx: 0, cy: 0, px: 0, py: 0,
  hover: null, ang: 0, dist: 0, lock: null, corner: null, sub: null, still: null, dwellT: 0, t0: 0, trail: [], path: 0, sel: false, ptype: "" };
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const W = { order: shuffle(Object.keys(TECH)), ti: 0, phase: "intro", queue: [], n: 0, total: 0, target: null, tPrompt: 0, wait: false, ratings: {}, notes: {} };
let trials = [];

const f = (n) => (Math.round(n * 10) / 10).toString();
const P = (r, deg) => { const a = ((deg - 90) * Math.PI) / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
const pt = (r, deg) => P(r, deg).map(f).join(" ");
const arc = (r0, r1, a0, a1) => `M${pt(r1, a0)}A${r1} ${r1} 0 0 1 ${pt(r1, a1)}L${pt(r0, a1)}A${r0} ${r0} 0 0 0 ${pt(r0, a0)}Z`;
const T = (r, deg, s, cls, dy = 0) => { const [x, y] = P(r, deg); return `<text x="${f(x)}" y="${f(y + dy)}" class="${cls}">${s}</text>`; };
const bearing = (dx, dy) => ((Math.atan2(dy, dx) * 180) / Math.PI + 450) % 360;
const dd = (a, b) => ((a - b + 540) % 360) - 180;
const name = (h) => (h ? ITEMS[h.i].label + (h.child != null ? " › " + ITEMS[h.i].kids[h.child] : "") : "");
const tech = () => TECH[S.tech];
const half = () => (tech().layout === "turn" ? 45 : 22.5);

// ---------- Recognizers ----------
function engage(i, ox, oy, via) { S.sub = { i, ox, oy, via }; clearTimeout(S.dwellT); dwellRing(null); }
function aim(x, y) {
  const dx = x - S.cx, dy = y - S.cy, t = tech();
  S.px = x; S.py = y; S.dist = Math.hypot(dx, dy); S.ang = bearing(dx, dy);
  if (S.sub) {
    const vx = dx - S.sub.ox, vy = dy - S.sub.oy;
    if (Math.hypot(vx, vy) < KID_MIN) { S.hover = { i: S.sub.i }; return; }
    const rel = dd(bearing(vx, vy), S.sub.i * 45);
    let best = -1, bd = 999;
    LAYOUT[t.layout].forEach((r, c) => { const d = Math.abs(dd(rel, r)); if (d < bd) { bd = d; best = c; } });
    S.hover = bd <= half() ? { i: S.sub.i, child: best } : null;
    return;
  }
  if (S.dist < DEAD) { S.hover = null; S.lock = null; S.corner = null; return; }
  const i = Math.round(S.ang / 45) % 8;
  if (S.tech === "dist") {
    const rel = (k) => dd(S.ang, k * 45);
    if (S.dist > OUTER) {
      // The outer slices span ±30° and cross into the neighbouring wedge, so lock onto the
      // nearest action with sub-actions within 30°, not the wedge under the pointer.
      if (S.lock == null || Math.abs(rel(S.lock)) > 32) {
        S.lock = null;
        ITEMS.forEach((it, k) => { if (it.kids && Math.abs(rel(k)) <= 30 && (S.lock == null || Math.abs(rel(k)) < Math.abs(rel(S.lock)))) S.lock = k; });
      }
      if (S.lock != null) { S.hover = { i: S.lock, child: Math.max(0, Math.min(2, Math.floor((rel(S.lock) + 30) / 20))) }; return; }
    } else S.lock = null;
    S.hover = { i };
    return;
  }
  if (t.turn) {
    // The corner advances while the pointer keeps moving outward; a bent leg long enough is a turn.
    if (!S.corner) S.corner = { x: dx, y: dy, d: S.dist, i };
    const c = S.corner, vx = dx - c.x, vy = dy - c.y, vl = Math.hypot(vx, vy);
    const bent = vl > 0 && Math.abs(dd(bearing(vx, vy), bearing(c.x, c.y))) >= TURN_DEV;
    if (!bent) S.corner = { x: dx, y: dy, d: S.dist, i };
    else if (vl >= TURN_LEG && ITEMS[c.i].kids && c.d >= CORNER_MIN) { engage(c.i, c.x, c.y, "turn"); return aim(x, y); }
    S.hover = { i: bent ? c.i : i };
    return;
  }
  S.hover = { i };
}
function watchStill() {
  if (!tech().pause || S.sub || S.sel) return;
  const dx = S.px - S.cx, dy = S.py - S.cy;
  if (S.still && Math.hypot(dx - S.still.x, dy - S.still.y) <= STILL_PX) return;
  S.still = { x: dx, y: dy };
  clearTimeout(S.dwellT);
  const i = Math.round(bearing(dx, dy) / 45) % 8;
  if (Math.hypot(dx, dy) < CORNER_MIN || !ITEMS[i].kids) { dwellRing(null); return; }
  dwellRing(S.still);
  S.dwellT = setTimeout(() => { if (!S.open || S.sub || S.sel) return; engage(i, S.still.x, S.still.y, "pause"); aim(S.px, S.py); draw(false); }, DWELL);
}
function dwellRing(p) {
  const g = $("pm").querySelector("#dw");
  if (g) g.innerHTML = p ? `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="12" class="dwell" style="animation-duration:${DWELL}ms"/>` : "";
}

// ---------- Menu drawing ----------
function centre(h) {
  const ring = S.sub ? `RING 2 · ${S.sub.via.toUpperCase()}` : h && h.child != null ? "RING 2 · DISTANCE" : "";
  return `<text y="-5" class="big">${h ? name(h).toUpperCase() : "QUAY"}</text><text y="12" class="sm">${ring}</text>`;
}
const trail = () => (S.trail.length > 1 ? `<polyline class="trail" points="${S.trail.map((p) => f(p[0]) + "," + f(p[1])).join(" ")}"/>` : "");
const stat = () => { let ticks = ""; for (let a = 0; a < 360; a += 5) ticks += `M${pt(a % 45 ? 187 : 183, a)}L${pt(191, a)}`;
  return `<g class="glow"><g class="spin"><circle r="201" class="line" stroke-width="1" stroke-dasharray="2 10"/></g>
    <path class="line" stroke-width=".7" opacity=".75" d="${ticks}"/><circle r="134" class="line" stroke-width=".5" opacity=".5"/></g>`; };
function subRing(h) {
  const sb = S.sub, a = sb.i * 45, hw = half(), lay = LAYOUT[tech().layout];
  let g = `<path class="spoke" d="M0 0L${f(sb.ox)} ${f(sb.oy)}"/><g class="sg" style="--h:${sb.i}" transform="translate(${f(sb.ox)} ${f(sb.oy)})">
    <circle r="${KID_MIN}" class="line" stroke-width="1"/><circle r="2.5" class="v"/>`;
  ITEMS[sb.i].kids.forEach((kid, c) => { const d = a + lay[c], co = h && h.child === c ? (S.sel ? " on sel" : " on") : "";
    g += `<path class="s c${co}" d="${arc(KID_MIN + 2, 58, d - hw + 3, d + hw - 3)}"/>` + T(74, d, kid.toUpperCase(), "l" + co); });
  return g + `</g>`;
}
function dyn(h) {
  const t = tech();
  let s = "";
  ITEMS.forEach((it, i) => {
    const a = i * 45, hot = h && h.i === i, o = hot ? (h.child == null && S.sel ? " on sel" : " on") : "";
    s += `<g class="sg" style="--h:${i}"><path class="s${o}" d="${arc(62, 128, a - 21, a + 21)}"/>${hot ? `<path class="s2" d="${arc(67, 123, a - 18.5, a + 18.5)}"/>` : ""}`
      + T(93, a, it.label.toUpperCase(), "l" + o) + T(116, a, it.key, "k");
    if (it.kids) s += `<path class="tab" d="M${pt(133, a - 12)}A133 133 0 0 1 ${pt(133, a + 12)}"/>`;
    if (it.kids && hot && S.tech === "dist") it.kids.forEach((kid, c) => { const a0 = a - 30 + c * 20, co = h.child === c ? (S.sel ? " on sel" : " on") : "";
      s += `<path class="s c${co}" d="${arc(138, 180, a0 + 1, a0 + 19)}"/>` + T(159, a0 + 10, kid.toUpperCase(), "l" + co); });
    if (it.kids && hot && !S.sub && t.preview) {
      const [bx, by] = P(160, a);
      it.kids.forEach((kid, c) => { const d = a + LAYOUT.turn[c], [ex, ey] = P(16, d), [lx, ly] = P(30, d);
        s += `<path class="gh" d="M${f(bx)} ${f(by)}l${f(ex)} ${f(ey)}"/><text x="${f(bx + lx)}" y="${f(by + ly)}" class="ght">${kid.toUpperCase()}</text>`; });
    }
    s += `</g>`;
  });
  if (S.sub) s += subRing(h);
  return s + `<g class="glow"><circle r="54" class="line" stroke-width="1"/></g>` + centre(h) + trail();
}
function draw(full) {
  const pm = $("pm");
  if (full) pm.innerHTML = `<svg viewBox="-230 -230 460 460" class="wire"><g>${stat()}</g><g id="dyn"></g><g id="dw"></g></svg>`;
  pm.querySelector("#dyn").innerHTML = dyn(S.hover);
}

// ---------- The dotted arrow that shows the next stroke ----------
function guide(tg) {
  let pts = [[0, 0]], wait = null;
  if (tg) {
    const a = tg.i * 45, k = tg.child;
    if (k == null) pts.push(P(ITEMS[tg.i].kids ? 92 : 100, a));
    else if (S.tech === "dist") pts.push(P(168, a - 20 + k * 20));
    else {
      const c = P(92, a), lay = LAYOUT[TECH[S.tech].layout], [lx, ly] = P(56, a + lay[k]);
      pts.push(c, [c[0] + lx, c[1] + ly]);
      if (S.tech === "pause") wait = c;
    }
  }
  const [ex, ey] = pts[pts.length - 1], [px, py] = pts[Math.max(0, pts.length - 2)], ang = Math.atan2(ey - py, ex - px);
  const head = tg ?`<polygon class="ghead" points="${f(ex + 10 * Math.cos(ang))},${f(ey + 10 * Math.sin(ang))} ${f(ex + 7 * Math.cos(ang + 2.2))},${f(ey + 7 * Math.sin(ang + 2.2))} ${f(ex + 7 * Math.cos(ang - 2.2))},${f(ey + 7 * Math.sin(ang - 2.2))}"/>` : "";
  const w = wait ? `<circle cx="${f(wait[0])}" cy="${f(wait[1])}" r="11" class="gwait"/><text x="${f(wait[0] + 30)}" y="${f(wait[1])}" class="gwait-t">HOLD</text>` : "";
  $("guide").innerHTML = `<svg viewBox="-230 -230 460 460"><circle r="${START_R}" class="start"/>` +
    (tg ? `<polyline class="gpath" points="${pts.map((p) => f(p[0]) + "," + f(p[1])).join(" ")}"/>${head}${w}` : `<text y="0" class="start-t">START HERE</text>`) + `</svg>`;
}

// ---------- Walkthrough ----------
function pool(n) {
  const kids = [], parents = [], plain = [];
  ITEMS.forEach((it, i) => { if (it.kids) { parents.push({ i }); it.kids.forEach((_, c) => kids.push({ i, child: c })); } else if ([1, 2, 7].includes(i)) plain.push({ i }); });
  if (n === MEASURED) return shuffle([...kids, ...parents, ...plain]);
  return shuffle([...shuffle(kids).slice(0, 4), shuffle(parents)[0], shuffle(plain)[0]]);
}
const round = () => `Round ${W.ti + 1} of 4 · ${TECH[W.order[W.ti]].name}`;
function card(html) { $("card").innerHTML = html; const b = $("card").querySelector(".go"); if (b) b.focus({ preventScroll: true }); }
function progressBar() {
  const per = PRACTICE + MEASURED, done = W.ti * per + (W.phase === "practice" ? W.n - 1 : W.phase === "measured" ? PRACTICE + W.n - 1 : W.phase === "rate" || W.phase === "measured-intro" ? (W.phase === "rate" ? per : PRACTICE) : 0);
  $("bar").style.width = (W.phase === "done" ? 100 : Math.max(0, (done * 100) / (4 * per))) + "%";
}
function setPhase(p) {
  W.phase = p; S.tech = W.order[W.ti];
  const t = TECH[S.tech], live = p === "practice" || p === "measured";
  $("arena").classList.toggle("off", !live);
  $("target").hidden = !live;
  if (p === "intro") {
    card(`<div class="step">What this is</div>
      <p>Some pie menu actions have a second ring of choices: Merge has Squash, Commit and Rebase. There are four ways the menu could let you reach that ring. You will try each one, the page times you and counts mistakes, and at the end you copy the results to Claude.</p>
      <p><b>Every stroke works the same way:</b> hold the <b>right mouse button</b> down inside the yellow circle in the box below, drag along the yellow dotted arrow, then let go.</p>
      <button class="go" id="go">Start</button>`);
    $("go").onclick = () => setPhase("tech-intro");
    guide(null); $("fb").className = "fb idle"; $("fb").textContent = "";
  } else if (p === "tech-intro") {
    card(`<div class="step">${round()}</div><h2>${t.name}</h2><p>${t.how}</p>
      <p class="m">First ${PRACTICE} practice strokes. Mistakes there do not count.</p><button class="go" id="go">Start practice</button>`);
    $("go").onclick = () => { W.queue = pool(PRACTICE); W.total = PRACTICE; setPhase("practice"); next(); };
    guide(null);
  } else if (p === "practice") {
    // card text is set per stroke in next()
  } else if (p === "measured-intro") {
    card(`<div class="step">${round()}</div><h2>Now ${MEASURED} timed strokes</h2><p>Same thing, counted this time. Go at your normal speed: as fast as feels comfortable, without rushing.</p>
      <button class="go" id="go">Start timed strokes</button>`);
    $("go").onclick = () => { W.queue = pool(MEASURED); W.total = MEASURED; setPhase("measured"); next(); };
    guide(null);
  } else if (p === "rate") {
    const k = S.tech;
    card(`<div class="step">${round()} · done</div><h2>How did ${t.name} feel?</h2>
      <fieldset class="rate" aria-label="Rating for ${t.name}">${["1 · Hated it", "2", "3 · OK", "4", "5 · Loved it"].map((l, i) => `<input type="radio" name="r" id="r${i + 1}" value="${i + 1}"><label for="r${i + 1}">${l}</label>`).join("")}</fieldset>
      <label for="note">Anything to add? (optional)</label><textarea id="note" rows="2"></textarea>
      <button class="go" id="go" disabled>${W.ti < 3 ? "Next round" : "See results"}</button>`);
    $("card").querySelectorAll('input[name="r"]').forEach((b) => b.onchange = () => { W.ratings[k] = Number(b.value); $("go").disabled = false; });
    $("go").onclick = () => { W.notes[k] = $("note").value.trim(); if (W.ti < 3) { W.ti++; setPhase("tech-intro"); } else setPhase("done"); };
    guide(null);
  } else if (p === "done") {
    card(`<div class="step">All done · thank you</div><h2>Copy the results to Claude</h2>
      <p>Press the button, then paste into the chat. That is all.</p>
      <div class="rate"><button class="go" id="copy" type="button">Copy results</button><span class="m" id="copy-msg" aria-live="polite"></span></div>`);
    $("copy").onclick = copy;
    renderResults(); $("results").hidden = false; guide(null);
  }
  progressBar();
}
function next() {
  W.wait = false;
  if (!W.queue.length) { setPhase(W.phase === "practice" ? "measured-intro" : "rate"); return; }
  W.target = W.queue.shift(); W.n = W.total - W.queue.length; W.tPrompt = performance.now();
  const tg = W.target;
  $("target-kind").textContent = tg.child != null ? "second ring" : ITEMS[tg.i].kids ? "first ring only, do not go into the second ring" : "first ring";
  $("target-name").textContent = name(tg).toUpperCase();
  card(`<div class="step">${round()} · ${W.phase === "practice" ? "practice" : "timed"} ${W.n} of ${W.total}</div>
    <p>Hold the right mouse button inside the yellow circle, follow the arrow to <b>${name(tg)}</b>, let go.${S.tech === "pause" && tg.child != null ? " At <b>HOLD</b>, stop until the ring fills." : ""}</p>
    <p class="m">${TECH[S.tech].how}</p>`);
  guide(tg); progressBar();
}
function classify(tg, got) {
  if (!got) return "cancelled";
  if (got.i !== tg.i) return "wrong-direction";
  if (tg.child == null && got.child == null) return "correct";
  if (tg.child == null) return "overshoot";
  if (got.child == null) return "undershoot";
  return got.child === tg.child ? "correct" : "wrong-choice";
}
const EXPLAIN = { "wrong-direction": "wrong action", overshoot: "went into the second ring", undershoot: "stayed on the first ring", "wrong-choice": "wrong choice in the second ring", cancelled: "nothing selected" };
function record(got, ms) {
  if (!W.target || W.wait || (W.phase !== "practice" && W.phase !== "measured")) return;
  const tg = W.target, outcome = classify(tg, got);
  trials.push({ tech: S.tech, round: W.ti + 1, mode: W.phase, trial: W.n, target: name(tg), targetKind: tg.child != null ? "sub-action" : ITEMS[tg.i].kids ? "parent" : "plain",
    got: got ? name(got) : "", outcome, strokeMs: ms, totalMs: Math.round(performance.now() - W.tPrompt), pathPx: Math.round(S.path),
    ring2: S.sub ? S.sub.via : got && got.child != null ? "distance" : "", pointer: S.ptype });
  const fb = $("fb");
  fb.className = "fb " + (outcome === "correct" ? "ok" : "bad");
  fb.textContent = outcome === "correct" ? `✓ ${ms} ms` : `✗ ${EXPLAIN[outcome]}${got ? ": got " + name(got) : ""}`;
  W.wait = true;
  setTimeout(next, 500);
}

// ---------- Results ----------
const median = (a) => { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function groups() {
  return W.order.map((k) => {
    const rows = trials.filter((r) => r.mode === "measured" && r.tech === k), ok = rows.filter((r) => r.outcome === "correct").length;
    const sub = rows.filter((r) => r.targetKind === "sub-action"), subOk = sub.filter((r) => r.outcome === "correct").length;
    const cnt = (o) => rows.filter((r) => r.outcome === o).length;
    return { k, n: rows.length, pct: rows.length ? ((rows.length - ok) * 100) / rows.length : NaN, subPct: sub.length ? ((sub.length - subOk) * 100) / sub.length : NaN,
      med: median(rows.map((r) => r.strokeMs)), subMed: median(sub.filter((r) => r.outcome === "correct").map((r) => r.strokeMs)), rating: W.ratings[k] ?? NaN,
      over: cnt("overshoot"), under: cnt("undershoot"), choice: cnt("wrong-choice"), dir: cnt("wrong-direction"), cancel: cnt("cancelled") };
  });
}
const COLS = [["Technique"], ["Strokes", "n"], ["Mistakes %", "pct", 0, "min"], ["Second-ring mistakes %", "subPct", 0, "min"], ["Median ms", "med", 0, "min"],
  ["Median second-ring ms", "subMed", 0, "min"], ["Rating /5", "rating", null, "max"], ["Went too far", "over"], ["Stopped short", "under"], ["Wrong choice", "choice"], ["Wrong action", "dir"], ["Nothing", "cancel"]];
const fmt = (v, dp) => (Number.isNaN(v) ? "—" : dp == null ? String(v) : v.toFixed(dp));
function renderResults() {
  const g = groups();
  const best = {}; COLS.forEach((c) => { if (!c[3]) return; const v = g.map((x) => x[c[1]]).filter((x) => !Number.isNaN(x)); if (v.length) best[c[1]] = c[3] === "min" ? Math.min(...v) : Math.max(...v); });
  $("table").innerHTML = `<table><thead><tr>${COLS.map((c) => `<th scope="col">${c[0]}</th>`).join("")}</tr></thead><tbody>` +
    g.map((x) => `<tr><td>${TECH[x.k].name}</td>${COLS.slice(1).map((c) => `<td class="${best[c[1]] === x[c[1]] ? "best" : ""}">${fmt(x[c[1]], c[2])}</td>`).join("")}</tr>`).join("") + `</tbody></table>`;
  const keys = ["tech", "round", "mode", "trial", "target", "targetKind", "got", "outcome", "strokeMs", "totalMs", "pathPx", "ring2", "pointer"];
  $("csv").value = [keys.join(","), ...trials.map((r) => keys.map((k) => JSON.stringify(r[k] ?? "")).join(","))].join("\n");
}
function markdown() {
  const g = groups(), ptr = {};
  trials.forEach((r) => { ptr[r.pointer] = (ptr[r.pointer] || 0) + 1; });
  const head = `| ${COLS.map((c) => c[0]).join(" | ")} |\n|${COLS.map((_, i) => (i ? " ---: " : " --- ")).join("|")}|\n`;
  const body = g.map((x) => `| ${TECH[x.k].name} | ${COLS.slice(1).map((c) => fmt(x[c[1]], c[2])).join(" | ")} |`).join("\n");
  const notes = W.order.filter((k) => W.notes[k]).map((k) => `- ${TECH[k].name}: ${W.notes[k]}`).join("\n");
  return `Pie second ring test, guided run. Order: ${W.order.map((k) => TECH[k].name).join(", ")}.\n\n${head}${body}\n\n` + (notes ? `Notes:\n${notes}\n\n` : "") +
    `Pointers: ${Object.entries(ptr).map(([k, v]) => `${k} ${v}`).join(", ")}. Pause ${DWELL} ms. Turn: ${CORNER_MIN} px first leg, ${TURN_LEG} px second leg at ${TURN_DEV}°+. Distance ring ${OUTER} px.`;
}
function copy() {
  const text = markdown(), msg = $("copy-msg");
  const fallback = () => { const c = $("csv"); c.value = text; c.closest("details").open = true; c.focus(); c.select(); msg.textContent = "Copy was blocked. The text is selected in the box below: press Ctrl+C."; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = "Copied. Paste it into the chat."; }, fallback); } catch { fallback(); }
}

// ---------- Input ----------
function open(x, y) {
  clearTimeout(S.dwellT);
  Object.assign(S, { open: true, drag: true, hover: null, lock: null, corner: null, sub: null, still: null, dist: 0, ang: 0, sel: false,
    trail: [[0, 0]], path: 0, t0: performance.now(), cx: x, cy: y, px: x, py: y });
  const pm = $("pm"); pm.style.left = x + "px"; pm.style.top = y + "px"; pm.hidden = false;
  draw(true);
}
function close() { clearTimeout(S.dwellT); S.open = false; S.drag = false; S.sub = null; $("pm").hidden = true; }
function finish() {
  if (!S.open || S.sel) return;
  const ms = Math.round(performance.now() - S.t0), h = S.hover;
  S.sel = true; clearTimeout(S.dwellT); dwellRing(null); draw(false);
  record(h, ms);
  setTimeout(close, h ? 230 : 0);
}
const arena = $("arena");
const pos = (e) => { const r = arena.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
arena.addEventListener("contextmenu", (e) => e.preventDefault());
arena.addEventListener("auxclick", (e) => e.preventDefault());
arena.addEventListener("pointerdown", (e) => {
  if (e.button === 1) e.preventDefault();
  if ((W.phase !== "practice" && W.phase !== "measured") || W.wait || S.open) return;
  const [x, y] = pos(e), fb = $("fb");
  if (e.button === 0) { fb.className = "fb bad"; fb.textContent = "Use the right mouse button, not the left"; return; }
  if (Math.hypot(x - arena.clientWidth / 2, y - arena.clientHeight / 2) > START_R) { fb.className = "fb bad"; fb.textContent = "Start inside the yellow circle"; return; }
  S.ptype = e.pointerType; fb.className = "fb idle"; fb.textContent = "";
  arena.setPointerCapture(e.pointerId); S.btn = e.button; open(x, y);
});
arena.addEventListener("pointermove", (e) => {
  if (!S.open || S.sel) return;
  const [x, y] = pos(e), lx = S.px, ly = S.py;
  aim(x, y); S.path += Math.hypot(x - lx, y - ly); S.trail.push([x - S.cx, y - S.cy]);
  watchStill(); draw(false);
});
arena.addEventListener("pointerup", (e) => { if (S.open && e.button === S.btn) finish(); });
arena.addEventListener("pointercancel", () => { if (S.open && !S.sel) close(); });

setPhase("intro");
</script>
