[package]
name = "quay-relay"
version = "0.1.0"
description = "Quay's relay: connects a CLI that reads only static configuration to Quay's MCP server."
authors = ["Sean Robert Wright"]
edition = "2024"
license = "AGPL-3.0"
publish = false

# A package of its own, not a member of the app's: the app's build script builds it into
# a target directory of its own while the app's build holds the app's.
[workspace]

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
quay-bridge-post = { path = "../bridge-post" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
