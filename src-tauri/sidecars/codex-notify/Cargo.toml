[package]
name = "quay-codex-notify"
version = "0.2.0"
description = "Tells Quay that a Codex turn ended. Codex runs it through its notify setting."
authors = ["Sean Robert Wright"]
edition = "2024"
license = "AGPL-3.0"
publish = false

# A package of its own, not a member of the app's: the app's build script builds it into
# a target directory of its own while the app's build holds the app's.
[workspace]

[dependencies]
quay-bridge-post = { path = "../bridge-post" }
serde_json = "1"

[dev-dependencies]
quay-bridge-post = { path = "../bridge-post", features = ["testing"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
