[package]
name = "tauri-app"
version = "0.5.0"
description = "Quay 2: Native Windows Autonomous Multi-Agent Workspace & Orchestrator"
authors = ["Sean Robert Wright"]
edition = "2024"
license = "AGPL-3.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
tokio = { version = "1.53.2", features = ["full"] }
axum = "0.8.9"
base64 = "0.22.1"
uuid = { version = "1.28.0", features = ["v4", "fast-rng"] }
parking_lot = "0.12.5"
tracing = "0.1.44"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tracing-subscriber = "0.3.23"
# The AI-WS-SDK crate, vendored verbatim by scripts/aiws-sdk/sync.ts (see vendor/aiws/SOURCE).
aiws-sdk = { path = "vendor/aiws/crates/aiws" }
# The same jsonschema the SDK uses, for the instance paths its validator doesn't report.
jsonschema = { version = "0.33", default-features = false }
vt100 = "0.18.1"
# Moves a deleted Praxis definition to the Recycle Bin or Trash, so it can be recovered.
trash = "5.2.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
