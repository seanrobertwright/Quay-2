[package]
name = "quay-record-replay"
version = "0.1.0"
description = "Records a real agent CLI run in a Quay terminal and replays it as a fake CLI, for tutorial screenshots"
edition = "2024"
license = "AGPL-3.0"
publish = false

[[bin]]
name = "quay-record-replay"
path = "src/main.rs"

# A stand-in agent CLI for the round-trip tests: it writes to its terminal, calls the bridge and
# answers one prompt. It is never copied onto a test account.
[[bin]]
name = "stub-agent"
path = "src/bin/stub-agent.rs"
test = false

[dependencies]
portable-pty = "=0.9.0"
flate2 = "1.1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
