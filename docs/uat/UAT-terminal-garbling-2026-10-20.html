<script id="uat-model" type="application/json">{"file":"UAT-terminal-garbling-2026-10-20.md","slug":"UAT-terminal-garbling-2026-10-20","title":"Quay 2 terminal garbling — User Acceptance Test","app":"Quay 2 — terminal garbling","level":"intermediate","generated":"2026-10-20","intro":"\u003ch3>How to use this checklist\u003c/h3>\n\u003cp>This checklist answers one question: \u003cstrong>when, and how, does a Quay terminal pane get garbled?\u003c/strong> Each test performs one trigger (relaunch, a project switch, a resize, a mod, a monitor change) and asks whether the pane is still clean afterwards. A \u003cstrong>Fail\u003c/strong> here is useful data, not a disappointment. Record every garble you see, even a small one.\u003c/p>\n\u003cp>\u003cstrong>Time:\u003c/strong> about 90 minutes. The sections run highest-suspicion first, so if you have to stop, use \u003cstrong>Submit what I have so far\u003c/strong> and the most important answers are already in. \u003cstrong>Save my work\u003c/strong> keeps everything between sittings.\u003c/p>\n\u003cp>\u003cstrong>What you need:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Windows 11 with this repo checked out at \u003ccode>E:\\Projects\\Quay2\u003c/code>, and the dev prerequisites from \u003ccode>CONTRIBUTING.md\u003c/code>: Node 20+, \u003ccode>pnpm\u003c/code> 10+, Rust 1.85+ (MSVC), and Visual Studio 2022 C++ build tools.\n\u003c/li>\n\u003cli>PowerShell 7 (\u003ccode>pwsh\u003c/code>) on your PATH.\n\u003c/li>\n\u003cli>Claude Code, Antigravity (\u003ccode>agy\u003c/code>) and Codex installed \u003cstrong>and signed in\u003c/strong>. Section 9 also uses one of OpenCode, Kiro or Copilot, whichever you have.\n\u003c/li>\n\u003cli>Two monitors with \u003cstrong>different\u003c/strong> display scaling (for example 100% and 150%), for Section 8.\n\u003c/li>\n\u003cli>Do \u003cstrong>not\u003c/strong> run this in a project where real agents are working. The tests open and close many terminals.\n\u003c/li>\n\u003c/ul>\n\u003ch4>Recording a result\u003c/h4>\n\u003cp>A pane is \u003cstrong>clean\u003c/strong> when, after the wait time the test gives, none of the symptoms below is visible. Wait the full time before you judge, because agents often redraw a second or two after a change.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>G1, stacked or overlapping:\u003c/strong> old frames drawn on top of new ones, such as two input boxes, repeated status lines, or text over text.\n\u003c/li>\n\u003cli>\u003cstrong>G2, shifted columns or bad wrap:\u003c/strong> text offset by one or more columns, box borders broken or jagged, lines wrapping at the wrong place.\n\u003c/li>\n\u003cli>\u003cstrong>G3, missing or stale output:\u003c/strong> the screen does not update, part of a redraw never arrives, blank areas, or typing does not echo.\n\u003c/li>\n\u003cli>\u003cstrong>G4, odd characters:\u003c/strong> stray fragments such as \u003ccode>[0m\u003c/code>, \u003ccode>;1H\u003c/code> or \u003ccode>[?25l\u003c/code>, the replacement character (a diamond with a question mark), or letters that do not belong.\n\u003c/li>\n\u003cli>\u003cstrong>G5, undersized:\u003c/strong> the program draws narrower or shorter than the pane, leaving an empty strip at the right or bottom wider than about one character.\n\u003c/li>\n\u003cli>\u003cstrong>G6, oversized:\u003c/strong> content is cut off at the right or bottom edge, or a full-width line wraps onto a second line.\n\u003c/li>\n\u003cli>\u003cstrong>G7, other:\u003c/strong> anything else. Describe it.\n\u003c/li>\n\u003c/ul>\n\u003cp>For every \u003cstrong>Fail\u003c/strong>, start the \u003cstrong>Notes\u003c/strong> with this line and fill it in:\u003c/p>\n\u003cpre>\u003ccode>Symptoms: G? | Appeared: &lt;which step, and how long after&gt; | Redraw fixed it: yes / no / partly | PROBE: &lt;paste&gt;\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Redraw\u003c/strong>: in a split layout, click the circular-arrow button in the pane header (tooltip \u003cstrong>Redraw terminal screen (Ctrl+L)\u003c/strong>). In a single pane there is no header, so click inside the terminal and press \u003ccode>Ctrl\u003c/code>+\u003ccode>L\u003c/code>.\n\u003c/li>\n\u003cli>\u003cstrong>PROBE\u003c/strong>: run the size probe below and paste the line it returns.\n\u003c/li>\n\u003cli>Always attach a screenshot of a garbled pane (\u003ccode>Win\u003c/code>+\u003ccode>Shift\u003c/code>+\u003ccode>S\u003c/code>, then \u003ccode>Ctrl\u003c/code>+\u003ccode>V\u003c/code> into the picture box).\n\u003c/li>\n\u003c/ul>\n\u003cp>Use the purple look-and-feel box for anything odd that is not garbling, such as flicker, a slow redraw or a jumpy cursor.\u003c/p>\n\u003ch4>Tool 1 — PROBE (xterm size versus pane size)\u003c/h4>\n\u003cp>PROBE is a snippet you paste into Quay's DevTools console. For every visible pane it reads how many columns and rows xterm is drawing and how many would fit, and changes nothing. \u003cstrong>Test 1.5 sets it up step by step.\u003c/strong> After that, each test that needs it says how to run it again: open the \u003cstrong>Console\u003c/strong> and press the up arrow to bring the snippet back.\u003c/p>\n\u003cp>\u003ccode>ok: true\u003c/code> means xterm fills its pane. \u003ccode>ok: false\u003c/code> means xterm itself is the wrong size, which is the \"terminal smaller than its window\" symptom (\u003cstrong>G5\u003c/strong>) at the xterm level.\u003c/p>\n\u003ch4>Tool 2 — RULER (what size the program thinks it is), PowerShell terminals only\u003c/h4>\n\u003cp>A one-line PowerShell command; every test that uses it gives the command in full. It prints the size the program inside the pane has been told, then a line of \u003ccode>#\u003c/code> exactly that wide. The \u003ccode>#\u003c/code> line should reach exactly to the right edge on \u003cstrong>one\u003c/strong> line. If it stops short, the program thinks the terminal is narrower than it is (\u003cstrong>G5\u003c/strong>). If it wraps onto a second line, the program thinks it is wider (\u003cstrong>G6\u003c/strong>). Write the \u003ccode>PTY says\u003c/code> numbers in Notes next to PROBE's \u003ccode>cols\u003c/code> and \u003ccode>rows\u003c/code>.\u003c/p>\n\u003ch4>Tool 3 — output generators, PowerShell terminals only\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>STREAM\u003c/strong>: about six seconds of steady output in many small pieces.\n\u003c/li>\n\u003cli>\u003cstrong>BIG\u003c/strong>: more than 256 KB of coloured output, larger than Quay's replay buffer.\n\u003c/li>\n\u003c/ul>\n\u003cp>The tests that use them give the command in full.\u003c/p>\n\u003ch4>Claude Code configurations A to D\u003c/h4>\n\u003cp>Your Claude Code settings use the fullscreen layout and have the claude-mods mods enabled. Several tests repeat a trigger in four configurations so we can tell a mod problem from a layout problem. Type the flags exactly into \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> when you start the terminal:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>A\u003c/strong>: leave the field empty. Mods on, fullscreen layout (alternate screen, mouse tracking).\n\u003c/li>\n\u003cli>\u003cstrong>B\u003c/strong>: \u003ccode>--settings {\"tui\":\"default\"}\u003c/code>. Mods on, main screen.\n\u003c/li>\n\u003cli>\u003cstrong>C\u003c/strong>: \u003ccode>--safe-mode\u003c/code>. Mods off (all plugins off), main screen.\n\u003c/li>\n\u003cli>\u003cstrong>D\u003c/strong>: \u003ccode>--safe-mode --settings {\"tui\":\"fullscreen\"}\u003c/code>. Mods off, fullscreen layout.\n\u003c/li>\n\u003c/ul>\n\u003cp>These four were checked against \u003ccode>claude.exe\u003c/code> on this machine: A and D enter the alternate screen, B and C do not. In C and D the event-bridge plugin is off too, so Quay's status badge for that terminal may stay on its first state. That is expected and is not a failure.\u003c/p>\n\u003ch4>Starting a terminal (used by every test)\u003c/h4>\n\u003cp>Every terminal in this checklist goes in project \u003cstrong>quay-uat-p\u003c/strong>, and each test says so. \"Start \u003cstrong>X\u003c/strong> labelled \u003ccode>name\u003c/code>\" means: click \u003cstrong>quay-uat-p\u003c/strong> in the left sidebar so it is selected, then click \u003cstrong>New Terminal\u003c/strong> in the top bar, click the \u003cstrong>X\u003c/strong> tile (\u003cstrong>Claude\u003c/strong>, \u003cstrong>Antigravity\u003c/strong>, \u003cstrong>Codex\u003c/strong>, \u003cstrong>OpenCode\u003c/strong>, \u003cstrong>Kiro\u003c/strong>, \u003cstrong>Copilot\u003c/strong> or \u003cstrong>PowerShell Console\u003c/strong>), fill in \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> if a config says so, type \u003ccode>name\u003c/code> into \u003cstrong>Terminal Label (Optional)\u003c/strong>, and click \u003cstrong>Start Terminal (Enter)\u003c/strong>. Leave \u003cstrong>Skip Permissions (Default)\u003c/strong> and the Model setting alone.\u003c/p>\n\u003cp>An agent is \u003cstrong>ready\u003c/strong> when its input box is showing and the screen has stopped changing, usually 5 to 15 seconds.\u003c/p>\n\u003ch4>The resize recipe (R)\u003c/h4>\n\u003cp>Several tests run this recipe on one terminal; each of them lists the steps in full. For reference, with a three-second wait and a check after every step:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>R1\u003c/strong>: click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> in the top bar. Using the dropdowns in the pane headers, put X in the left pane and \u003ccode>ps-1\u003c/code> in the right pane.\n\u003c/li>\n\u003cli>\u003cstrong>R2\u003c/strong>: drag the divider between the panes to about 30% and let go.\n\u003c/li>\n\u003cli>\u003cstrong>R3\u003c/strong>: drag it to about 70% and let go.\n\u003c/li>\n\u003cli>\u003cstrong>R4\u003c/strong>: click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong>. X should be the pane showing.\n\u003c/li>\n\u003cli>\u003cstrong>R5\u003c/strong>: maximise the Quay window, wait, then restore it to its normal size.\n\u003c/li>\n\u003c/ol>\n\u003cp>Write the first step where garbling appeared (for example \u003ccode>Appeared: R2, at once\u003c/code>).\u003c/p>\n\u003ch3>Words used in this document\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Pane\u003c/strong>: one terminal's rectangle on the stage. A split shows two panes and the grid shows four.\n\u003c/li>\n\u003cli>\u003cstrong>Rail\u003c/strong>: the left sidebar listing projects and terminals.\n\u003c/li>\n\u003cli>\u003cstrong>Stage\u003c/strong>: the area to the right of the rail where panes are drawn.\n\u003c/li>\n\u003cli>\u003cstrong>uat-p / uat-empty\u003c/strong>: the two scratch projects Section 1 creates. uat-empty never gets a terminal, and clicking it is how several tests make Quay rebuild every pane.\n\u003c/li>\n\u003cli>\u003cstrong>Relaunch\u003c/strong>: restarting a terminal that has exited, using the \u003cstrong>Relaunch Agent\u003c/strong> button on its \u003cstrong>Session Inactive\u003c/strong> ribbon, or the \u003cstrong>Relaunch\u003c/strong> link in its rail row.\n\u003c/li>\n\u003cli>\u003cstrong>Fullscreen layout / main screen\u003c/strong>: the two ways Claude Code draws (see configs A to D).\n\u003c/li>\n\u003cli>\u003cstrong>Mods\u003c/strong>: Claude Code plugins that draw into its screen. Yours include side panes (Archon, GitHub, Outputs, Sources, Dev servers, What's next), the two animated \u003cstrong>hud\u003c/strong> lines under the prompt, bands above the prompt (shelf, quick-reply, presets, session namer, lint-test gate) and turn-chime toasts.\n\u003c/li>\n\u003c/ul>","outro":"\u003ch3>Cleanup (not a test)\u003c/h3>\n\u003cul>\n\u003cli>Close the test terminals with their rail \u003cstrong>X\u003c/strong>.\n\u003c/li>\n\u003cli>Remove \u003cstrong>quay-uat-p\u003c/strong> and \u003cstrong>quay-uat-empty\u003c/strong> from the rail with their remove buttons (\u003cstrong>Remove workspace ...\u003c/strong>), then delete the folders: \u003ccode>Remove-Item -Recurse -Force \"$HOME\\quay-uat-p\", \"$HOME\\quay-uat-empty\"\u003c/code>. \u003cstrong>This deletes those two folders permanently.\u003c/strong> They hold only test files.\n\u003c/li>\n\u003c/ul>\n\u003ch3>Not in scope (deferred — do NOT test)\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Gemini, Pi, Grok, Aider\u003c/strong>: not installed on the test machine.\n\u003c/li>\n\u003cli>\u003cstrong>The released v0.2.0 installer\u003c/strong>: this run uses the dev build so DevTools is available.\n\u003c/li>\n\u003cli>\u003cstrong>Swarm-launched terminals\u003c/strong>: they go through the same spawn and pane code as \u003cstrong>New Terminal\u003c/strong>, so they are covered indirectly.\n\u003c/li>\n\u003cli>\u003cstrong>Terminal search (Ctrl+F)\u003c/strong> and the Archon, Machina and GitHub drawers: these are overlays that do not resize panes.\n\u003c/li>\n\u003c/ul>\n\u003ch3>What each section probes (for whoever processes the results)\u003c/h3>\n\u003cp>These are suspicions drawn from reading the code at commit \u003ccode>5993069\u003c/code>. Each one is a hypothesis to check against the results, not a confirmed bug.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Relaunch (Section 2, 9.7, 10.2).\u003c/strong> Relaunch keeps the pane mounted, so \u003ccode>useTerminal\u003c/code> keeps its \u003ccode>highestSeq\u003c/code> from the old process. \u003ccode>PtySession::spawn\u003c/code> starts the new process's \u003ccode>seq\u003c/code> at 1, and the \u003ccode>pty-output\u003c/code> listener drops every chunk whose \u003ccode>seq\u003c/code> is not above \u003ccode>highestSeq\u003c/code>. A pane that saw N chunks would hide the new process's first N chunks, and the old screen is not cleared either. A terminal restored from disk starts at \u003ccode>last_seq\u003c/code> 0 (\u003ccode>read_saved_scrollback\u003c/code>), so 10.2 is the control for 2.3. 2.1 against 2.2 separates \"many old chunks\" from \"few\".\n\u003c/li>\n\u003cli>\u003cstrong>Pane rebuild (Section 3, 9.2, 9.4, 9.6).\u003c/strong> When the active project has no terminals, \u003ccode>Stage\u003c/code> returns its \u003ccode>Placeholder\u003c/code> branch, which is a different element tree, so every \u003ccode>TerminalView\u003c/code> unmounts. Coming back mounts fresh xterm instances that replay up to 256 KB of raw output (\u003ccode>get_terminal_output\u003c/code>) recorded at whatever sizes the PTY had, into a pane of today's size.\n\u003c/li>\n\u003cli>\u003cstrong>Buffer cut (3.5, 10.1).\u003c/strong> \u003ccode>trim_output_buffer\u003c/code> and \u003ccode>read_saved_scrollback\u003c/code> drop the oldest bytes. A cut can land inside an escape sequence, or drop the alternate-screen switch that later bytes depend on.\n\u003c/li>\n\u003cli>\u003cstrong>First frame (Section 4).\u003c/strong> \u003ccode>spawn_terminal\u003c/code> is given \u003ccode>getGlobalTerminalDimensions\u003c/code>, the size of whichever pane was fitted last anywhere (for example a grid quarter). \u003ccode>syncPtySize\u003c/code> sends the first fit without the follow-up \u003ccode>Ctrl+L\u003c/code>, so a program that drew its first frame at the old size is never asked to redraw.\n\u003c/li>\n\u003cli>\u003cstrong>Resize (Section 5).\u003c/strong> Each size change sends \u003ccode>resize_pty\u003c/code> and then \u003ccode>Ctrl+L\u003c/code> 60 ms later, so a drag sends a burst. Programs that do not treat \u003ccode>Ctrl+L\u003c/code> as \"redraw\" keep stale frames. Hidden panes skip \u003ccode>syncPtySize\u003c/code> until they are shown. \u003ccode>SkipBanner\u003c/code> changes the stage height when focus moves between panes (5.11).\n\u003c/li>\n\u003cli>\u003cstrong>Mods and layout (Section 6).\u003c/strong> With \u003ccode>tui: fullscreen\u003c/code>, Claude Code enters the alternate screen, enables mouse tracking and uses synchronized output (measured with a ConPTY probe). Mods dock side panes from 110 columns, and unasked panes from 144. hud redraws all the time. Configs A to D separate mods from layout.\n\u003c/li>\n\u003cli>\u003cstrong>Widths (Section 7).\u003c/strong> \u003ccode>createClaudeUnicodeProvider\u003c/code> widens VS16 and emoji to two cells. ConPTY and each agent have their own width tables, and any disagreement shows up as shifted columns.\n\u003c/li>\n\u003cli>\u003cstrong>Cell metrics (Section 8, 10.3).\u003c/strong> A scale change or a late font change alters the cell size. Panes refit only when their container's size changes (\u003ccode>ResizeObserver\u003c/code>).\n\u003c/li>\n\u003c/ul>\n\u003ch3>Sign-off\u003c/h3>\n\u003cul>\n\u003cli>Tester name: ______  Date: ______\n\u003c/li>\n\u003c/ul>","annotator":"","sections":[{"id":"1","title":"Setup and baseline","tests":[{"id":"1.1","title":"Start the Quay dev build","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Run Quay from source so DevTools is available.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> Nothing.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Open PowerShell in \u003ccode>E:\\Projects\\Quay2\u003c/code> and run \u003ccode>pnpm install\u003c/code>.\n\u003c/li>\n\u003cli>Run \u003ccode>pnpm tauri dev\u003c/code>. Leave this terminal open for the whole run, since closing it closes Quay. The first build can take several minutes.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> A window titled \u003cstrong>Quay — Claude Code Workspace &amp; Orchestrator\u003c/strong> opens.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note the last error lines from the PowerShell window. Nothing else in this checklist can run without it.\n\u003c/li>\n\u003c/ul>"},{"id":"1.2","title":"Create and add the two scratch projects","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> One project to work in, and one empty project used to force pane rebuilds.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 1.1 passed.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>In a separate PowerShell window, run: \u003ccode>New-Item -ItemType Directory -Force \"$HOME\\quay-uat-p\", \"$HOME\\quay-uat-empty\" | Out-Null; git -C \"$HOME\\quay-uat-p\" init\u003c/code>\n\u003c/li>\n\u003cli>In Quay, click \u003cstrong>Add\u003c/strong> (tooltip \u003cstrong>Add Project Workspace\u003c/strong>) at the top of the rail and add the folder \u003ccode>quay-uat-p\u003c/code> from your home folder. Repeat for \u003ccode>quay-uat-empty\u003c/code>.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Both projects appear in the rail as \u003cstrong>quay-uat-p\u003c/strong> and \u003cstrong>quay-uat-empty\u003c/strong>, and the count badge next to each shows \u003ccode>0\u003c/code>.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note the error the Add Project dialog shows.\n\u003c/li>\n\u003c/ul>"},{"id":"1.3","title":"uat-p has no workspace launch flags","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Make sure the A to D flags are the only flags Claude gets.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 1.2 passed.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>In the \u003cstrong>quay-uat-p\u003c/strong> row of the rail, click the gear (tooltip \u003cstrong>Workspace Settings (Env Vars &amp; Flags) for quay-uat-p\u003c/strong>).\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The custom flags field is empty and no environment variables are listed.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Clear the flags, save, and note what was there.\n\u003c/li>\n\u003c/ul>"},{"id":"1.4","title":"Get every agent past its first-run prompts","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Trust dialogs and sign-in screens must not appear in the middle of a later test.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 1.3 passed.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>warmup-claude\u003c/code>. Answer any \"trust this folder\" prompt. Wait until ready.\n\u003c/li>\n\u003cli>Do the same for \u003cstrong>Antigravity\u003c/strong> (\u003ccode>warmup-agy\u003c/code>), \u003cstrong>Codex\u003c/strong> (\u003ccode>warmup-codex\u003c/code>) and your OpenCode, Kiro or Copilot (\u003ccode>warmup-x\u003c/code>).\n\u003c/li>\n\u003cli>Close all four terminals with the \u003cstrong>X\u003c/strong> (\u003cstrong>Close terminal\u003c/strong>) on each rail row.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> All four agents reached their input prompt in uat-p.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note which agent stopped at which screen. Mark tests for that agent \u003cstrong>Not done\u003c/strong>.\n\u003c/li>\n\u003c/ul>"},{"id":"1.5","title":"Baseline: a fresh PowerShell pane fills its space","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Confirm PROBE reads correctly on a pane that should be perfect, and record your normal cell size.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 1.4 passed. The Quay window is at its normal (not maximised) size.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>PowerShell Console\u003c/strong> labelled \u003ccode>ps-1\u003c/code>. Leave the layout as a single pane.\n\u003c/li>\n\u003cli>Open DevTools: click an empty part of the left rail, then press \u003ccode>F12\u003c/code> (or right-click the rail and choose \u003cstrong>Inspect\u003c/strong>). Click the \u003cstrong>Console\u003c/strong> tab.\n\u003c/li>\n\u003cli>Click in the console, paste the PROBE snippet below, and press Enter. If the console refuses to paste, type \u003ccode>allow pasting\u003c/code>, press Enter, and paste again.\n\u003c/li>\n\u003cli>A table prints, followed by one line of text that holds the same numbers. That last line is the one to copy.\n\u003c/li>\n\u003cli>Leave DevTools open if you like; if you close it, \u003ccode>F12\u003c/code> brings it back with the snippet still in its history (press the up arrow in the console).\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>  (() =&gt; { const out = []; document.querySelectorAll('.xterm').forEach((x) =&gt; { const host = x.parentElement; const cs = getComputedStyle(host); const w = parseInt(cs.width), h = parseInt(cs.height); if (!w) return; const scr = x.querySelector('.xterm-screen').getBoundingClientRect(); const m = x.querySelector('.xterm-char-measure-element'); const dpr = devicePixelRatio; const devCell = m ? Math.floor((m.getBoundingClientRect().width / 32) * dpr) : NaN; const cols = Math.round((scr.width * dpr) / devCell); const rows = x.querySelectorAll('.xterm-rows &gt; div').length; const cellW = scr.width / cols, cellH = scr.height / rows; const pane = host.parentElement.parentElement; const label = pane.querySelector('select')?.selectedOptions[0]?.text || pane.querySelector('.h-7 .font-medium')?.textContent || 'single pane'; const fitCols = Math.floor((w - 14) / cellW), fitRows = Math.floor(h / cellH); out.push({ pane: label, cols, rows, fitCols, fitRows, ok: cols === fitCols &amp;&amp; rows === fitRows, gapRightPx: Math.round(w - scr.width), gapBottomPx: Math.round(h - scr.height), cellW: +cellW.toFixed(2), dpr }); }); console.table(out); return JSON.stringify(out); })()\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> One row, with \u003ccode>ok: true\u003c/code>. \u003cstrong>Copy the line into Notes even on Pass\u003c/strong>, because its \u003ccode>cellW\u003c/code> and \u003ccode>dpr\u003c/code> are the baseline for Sections 8 and 10.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> If \u003ccode>ok\u003c/code> is \u003ccode>false\u003c/code>, paste the line. The rest of the checklist is still worth running.\n\u003c/li>\n\u003c/ul>"},{"id":"1.6","title":"Baseline: PowerShell agrees with xterm about the size","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Confirm the program inside the pane is told the same size xterm draws.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 1.5 done; \u003ccode>ps-1\u003c/code> is showing.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click inside \u003ccode>ps-1\u003c/code>, run RULER: type \u003ccode>$s = $Host.UI.RawUI.WindowSize; \"PTY says $($s.Width) cols x $($s.Height) rows\"; '#' * $s.Width\u003c/code> and press Enter.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> \u003ccode>PTY says\u003c/code> shows the same columns and rows as the \u003ccode>cols\u003c/code> and \u003ccode>rows\u003c/code> PROBE printed in test 1.5, and the \u003ccode>#\u003c/code> line exactly fills one line.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Write both pairs of numbers in Notes, and say whether the \u003ccode>#\u003c/code> line stopped short or wrapped.\n\u003c/li>\n\u003c/ul>"}]},{"id":"2","title":"Relaunch (reported by the user)","tests":[{"id":"2.1","title":"Relaunched PowerShell shows its prompt, after a busy first run","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A relaunched terminal shows its new output at once, even when the old run printed a lot.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> Section 1 done. Single pane layout.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>PowerShell Console\u003c/strong> labelled \u003ccode>relaunch-busy\u003c/code>.\n\u003c/li>\n\u003cli>Run STREAM: type \u003ccode>1..400 | ForEach-Object { \"line $_ \" + ('=' * 60); Start-Sleep -Milliseconds 15 }\u003c/code> and press Enter. Wait until \u003ccode>line 400\u003c/code> appears.\n\u003c/li>\n\u003cli>Type \u003ccode>exit\u003c/code> and press Enter. A \u003cstrong>Session Inactive\u003c/strong> ribbon appears at the top of the pane.\n\u003c/li>\n\u003cli>Click \u003cstrong>Relaunch Agent\u003c/strong> on the ribbon, then wait 5 seconds.\n\u003c/li>\n\u003cli>Type \u003ccode>echo relaunched\u003c/code> and press Enter.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Within 5 seconds of step 4 a new \u003ccode>PS ...&gt;\u003c/code> prompt is visible, and step 5 shows your typing and prints \u003ccode>relaunched\u003c/code>.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record G3 if nothing new appeared. Then press Enter about 20 more times and note whether output starts appearing at some point (roughly how many presses). Finally, click \u003cstrong>quay-uat-empty\u003c/strong> in the rail, click \u003cstrong>quay-uat-p\u003c/strong> again, and note whether the prompt shows up now.\n\u003c/li>\n\u003c/ul>"},{"id":"2.2","title":"Relaunched PowerShell shows its prompt, after a quiet first run","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The same check when the first run printed almost nothing.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 2.1 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>PowerShell Console\u003c/strong> labelled \u003ccode>relaunch-quiet\u003c/code>. Wait for its prompt.\n\u003c/li>\n\u003cli>Type \u003ccode>exit\u003c/code> and press Enter right away.\n\u003c/li>\n\u003cli>Click \u003cstrong>Relaunch Agent\u003c/strong>, then wait 5 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> A complete new prompt appears below the old output within 5 seconds, and no new text overwrites old text higher up.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note whether the prompt is missing completely, appears only partly, or appears after you type a few characters.\n\u003c/li>\n\u003c/ul>"},{"id":"2.3","title":"Relaunched Claude Code (config A) draws a clean screen","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Relaunching Claude in your normal setup gives a usable, clean screen.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 2.2 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>relaunch-A\u003c/code>, leaving \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> empty (config A). Wait until ready.\n\u003c/li>\n\u003cli>Send \u003ccode>Reply with only the word ready\u003c/code> and wait for the reply.\n\u003c/li>\n\u003cli>Type \u003ccode>/exit\u003c/code> and press Enter. Wait for \u003cstrong>Session Inactive\u003c/strong>.\n\u003c/li>\n\u003cli>Click \u003cstrong>Relaunch Agent\u003c/strong> and wait 15 seconds.\n\u003c/li>\n\u003cli>Type \u003ccode>hello\u003c/code> into the input box, without sending it.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The pane shows one complete Claude Code screen: an intact input box with whole borders, no pieces of the earlier session drawn over it, and \u003ccode>hello\u003c/code> appears in the box.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms. Try Redraw (\u003ccode>Ctrl\u003c/code>+\u003ccode>L\u003c/code>) and note the result. Then click \u003cstrong>quay-uat-empty\u003c/strong> and back to \u003cstrong>quay-uat-p\u003c/strong>, and note whether the screen is clean after that.\n\u003c/li>\n\u003c/ul>"},{"id":"2.4","title":"Relaunched Claude Code (config C) draws a clean screen","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The same relaunch on the main-screen layout with mods off.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 2.3 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>relaunch-C\u003c/code>, with \u003ccode>--safe-mode\u003c/code> typed into \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> (config C). Wait until ready.\n\u003c/li>\n\u003cli>Do steps 2 to 5 of test 2.3 in this terminal.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Same as 2.3: a clean new Claude screen below the earlier transcript, with \u003ccode>hello\u003c/code> in the input box.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> As in 2.3.\n\u003c/li>\n\u003c/ul>"},{"id":"2.5","title":"Relaunched Antigravity draws a clean screen","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Relaunch works for agy.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 2.4 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Antigravity\u003c/strong> labelled \u003ccode>relaunch-agy\u003c/code>. Wait until ready.\n\u003c/li>\n\u003cli>Send \u003ccode>Reply with only the word ready\u003c/code> and wait for the reply.\n\u003c/li>\n\u003cli>Exit agy: press \u003ccode>Ctrl\u003c/code>+\u003ccode>C\u003c/code>, and again if it asks. Note in Notes what made it exit. Wait for \u003cstrong>Session Inactive\u003c/strong>.\n\u003c/li>\n\u003cli>Click \u003cstrong>Relaunch Agent\u003c/strong> and wait 15 seconds, then type \u003ccode>hello\u003c/code> without sending it.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> One complete agy screen with an intact input area and \u003ccode>hello\u003c/code> in it.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> As in 2.3.\n\u003c/li>\n\u003c/ul>"},{"id":"2.6","title":"Relaunched Codex draws a clean screen","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Relaunch works for Codex.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 2.5 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Codex\u003c/strong> labelled \u003ccode>relaunch-codex\u003c/code>. Wait until ready.\n\u003c/li>\n\u003cli>Send \u003ccode>Reply with only the word ready\u003c/code> and wait for the reply.\n\u003c/li>\n\u003cli>Type \u003ccode>/quit\u003c/code> and press Enter. If that does nothing, press \u003ccode>Ctrl\u003c/code>+\u003ccode>C\u003c/code> twice. Note which worked.\n\u003c/li>\n\u003cli>Click \u003cstrong>Relaunch Agent\u003c/strong> and wait 15 seconds, then type \u003ccode>hello\u003c/code> without sending it.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> One complete Codex screen with an intact input area and \u003ccode>hello\u003c/code> in it.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> As in 2.3.\n\u003c/li>\n\u003c/ul>"},{"id":"2.7","title":"Relaunch from the rail link behaves like the ribbon button","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The rail's \u003cstrong>Relaunch\u003c/strong> link gives the same clean result.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 2.6 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>In \u003ccode>relaunch-A\u003c/code> (Claude config A), type \u003ccode>/exit\u003c/code> and wait for it to exit.\n\u003c/li>\n\u003cli>In the rail, click the small \u003cstrong>Relaunch\u003c/strong> link next to \u003ccode>exited\u003c/code> in the \u003ccode>relaunch-A\u003c/code> row.\n\u003c/li>\n\u003cli>Wait 15 seconds and type \u003ccode>hello\u003c/code> without sending it.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> A clean Claude screen, as in 2.3.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> As in 2.3. Also note whether this second relaunch looks worse than the first.\n\u003c/li>\n\u003c/ul>"}]},{"id":"3","title":"Pane rebuild and replay","tests":[{"id":"3.1","title":"Rebuilt PowerShell pane matches what was there before","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Switching to an empty project and back must not damage a pane.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> Section 2 done. Single pane, showing \u003ccode>ps-1\u003c/code>.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>In \u003ccode>ps-1\u003c/code> run \u003ccode>Get-ChildItem $env:SystemRoot | Select-Object -First 30\u003c/code>, then take a screenshot.\n\u003c/li>\n\u003cli>Click \u003cstrong>quay-uat-empty\u003c/strong> in the rail (the stage shows \u003cstrong>Launch Terminal\u003c/strong>), then click \u003cstrong>quay-uat-p\u003c/strong> and select \u003ccode>ps-1\u003c/code> again.\n\u003c/li>\n\u003cli>Wait 3 seconds and take a second screenshot.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The listing and the prompt look the same as before, aligned the same way.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Attach both screenshots.\n\u003c/li>\n\u003c/ul>"},{"id":"3.2","title":"Rebuilt Claude Code pane (config A) is clean","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A fullscreen Claude pane survives a rebuild.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 3.1 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>rebuild-A\u003c/code>, leaving \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> empty (config A). Wait until ready.\n\u003c/li>\n\u003cli>Send \u003ccode>List the numbers 1 to 40, one per line\u003c/code> and wait for the reply.\n\u003c/li>\n\u003cli>Click \u003cstrong>quay-uat-empty\u003c/strong>, then \u003cstrong>quay-uat-p\u003c/strong>, then \u003ccode>rebuild-A\u003c/code>. Wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> One clean Claude screen with an intact input box. Stray text above or around it from earlier frames counts as a Fail (G1).\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms, then try Redraw and note the result.\n\u003c/li>\n\u003c/ul>"},{"id":"3.3","title":"Rebuilt Claude Code pane (config C) is clean","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The same rebuild on the main-screen layout with mods off.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 3.2 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>rebuild-C\u003c/code>, with \u003ccode>--safe-mode\u003c/code> typed into \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> (config C). Wait until ready.\n\u003c/li>\n\u003cli>Send \u003ccode>List the numbers 1 to 40, one per line\u003c/code> and wait for the reply.\n\u003c/li>\n\u003cli>Click \u003cstrong>quay-uat-empty\u003c/strong>, then \u003cstrong>quay-uat-p\u003c/strong>, then \u003ccode>rebuild-C\u003c/code>. Wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The transcript, numbers 1 to 40, reads cleanly in order, and the input box below it is intact.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> As in 3.2.\n\u003c/li>\n\u003c/ul>"},{"id":"3.4","title":"Rebuild after the pane changed size during its life","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Replaying output recorded at several sizes into one new pane.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 3.3 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Show \u003ccode>rebuild-C\u003c/code>, then run steps R1 to R4 of the resize recipe on it:\n\u003cul>\n\u003cli>\u003cstrong>R1:\u003c/strong> click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> in the top bar. Using the dropdowns in the pane headers, put \u003ccode>rebuild-C\u003c/code> in the left pane and \u003ccode>ps-1\u003c/code> in the right pane. Wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R2:\u003c/strong> drag the divider between the panes to about 30%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R3:\u003c/strong> drag it to about 70%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R4:\u003c/strong> click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong> so \u003ccode>rebuild-C\u003c/code> fills the stage, and wait 3 seconds.\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Send \u003ccode>List the numbers 41 to 60, one per line\u003c/code> and wait for the reply.\n\u003c/li>\n\u003cli>Click \u003cstrong>quay-uat-empty\u003c/strong>, then \u003cstrong>quay-uat-p\u003c/strong>, then \u003ccode>rebuild-C\u003c/code>. Wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The whole transcript, 1 to 60, is readable, and earlier lines are not drawn over later ones.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note which part is damaged: the oldest output, the middle, or the current screen.\n\u003c/li>\n\u003c/ul>"},{"id":"3.5","title":"Overflowing the replay buffer leaves no fragments at the top","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> When old output is dropped from the 256 KB replay buffer, the cut must not leave odd characters behind.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 3.4 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>PowerShell Console\u003c/strong> labelled \u003ccode>big\u003c/code>. Run BIG: type \u003ccode>$e = [char]27; 1..6000 | ForEach-Object { \"$e[3$($_ % 7 + 1)mrow $_ $e[0m\" + ('x' * 50) }\u003c/code> and press Enter, then wait for the prompt to return (about 10 to 30 seconds).\n\u003c/li>\n\u003cli>Click \u003cstrong>quay-uat-empty\u003c/strong>, then \u003cstrong>quay-uat-p\u003c/strong>, then \u003ccode>big\u003c/code>. Wait 3 seconds.\n\u003c/li>\n\u003cli>Scroll the pane all the way to the top with the mouse wheel.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The very first line is a whole coloured \u003ccode>row NNNN xxxx...\u003c/code> line (or part of one with no stray codes). No fragments such as \u003ccode>[3\u003c/code>, \u003ccode>;1m\u003c/code> or \u003ccode>m\u003c/code> begin the line.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record G4 and screenshot the top of the pane.\n\u003c/li>\n\u003c/ul>"},{"id":"3.6","title":"A hidden terminal keeps everything it printed while hidden","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Switching between terminals in the same project (no rebuild) loses nothing.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 3.5 answered. Single pane layout.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Show \u003ccode>ps-1\u003c/code>, run STREAM: type \u003ccode>1..400 | ForEach-Object { \"line $_ \" + ('=' * 60); Start-Sleep -Milliseconds 15 }\u003c/code> and press Enter, then \u003cstrong>immediately\u003c/strong> click \u003ccode>big\u003c/code> in the rail.\n\u003c/li>\n\u003cli>Wait 10 seconds, then click \u003ccode>ps-1\u003c/code> again.\n\u003c/li>\n\u003cli>Scroll up through the output.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Lines \u003ccode>line 1\u003c/code> to \u003ccode>line 400\u003c/code> are all present in order, each on its own line, and a prompt follows \u003ccode>line 400\u003c/code>.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note the first missing or damaged line number.\n\u003c/li>\n\u003c/ul>"}]},{"id":"4","title":"The first frame of a new terminal","tests":[{"id":"4.1","title":"New Claude Code (config A) in a single pane: first frame clean","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Baseline for this section: a new Claude pane in the simplest case.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> Section 3 done. Single pane layout, window at normal size.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>first-A\u003c/code>, leaving \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> empty (config A). Watch it closely as it appears, then wait 10 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> From its first visible frame Claude draws at the full pane width: the input box spans the pane, nothing is drawn twice, and nothing jumps sideways.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Say whether the problem was only in the first second or still there after 10 seconds.\n\u003c/li>\n\u003c/ul>"},{"id":"4.2","title":"New PowerShell started from a grid is told the right size","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A terminal created while the stage is a 2×2 grid gets the size of the pane it is shown in.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 4.1 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>2x2 Grid Layout\u003c/strong> in the top bar and put \u003ccode>ps-1\u003c/code>, \u003ccode>big\u003c/code>, \u003ccode>first-A\u003c/code> and \u003ccode>rebuild-C\u003c/code> in the four slots using the pane dropdowns. Wait 3 seconds.\n\u003c/li>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>PowerShell Console\u003c/strong> labelled \u003ccode>from-grid\u003c/code>.\n\u003c/li>\n\u003cli>Click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong>, then click \u003ccode>from-grid\u003c/code> in the rail. Wait 3 seconds.\n\u003c/li>\n\u003cli>Click inside \u003ccode>from-grid\u003c/code>, run RULER: type \u003ccode>$s = $Host.UI.RawUI.WindowSize; \"PTY says $($s.Width) cols x $($s.Height) rows\"; '#' * $s.Width\u003c/code> and press Enter. Then run PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints).\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> \u003ccode>PTY says\u003c/code> matches PROBE's \u003ccode>cols\u003c/code> and \u003ccode>rows\u003c/code>, and the \u003ccode>#\u003c/code> line fills one line exactly.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Write both pairs of numbers. Then press \u003ccode>Ctrl\u003c/code>+\u003ccode>L\u003c/code>, run the RULER command again, and note whether the numbers now match.\n\u003c/li>\n\u003c/ul>"},{"id":"4.3","title":"New Claude Code (config A) started from a grid: first frame clean","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The same grid-born case for Claude.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 4.2 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Return to \u003cstrong>2x2 Grid Layout\u003c/strong> with four terminals in the slots. Wait 3 seconds.\n\u003c/li>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>grid-born-A\u003c/code>, leaving \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> empty (config A).\n\u003c/li>\n\u003cli>Click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong> and click \u003ccode>grid-born-A\u003c/code> in the rail. Wait 10 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Claude fills the full pane width with a clean screen.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints). Try Redraw and note the result.\n\u003c/li>\n\u003c/ul>"},{"id":"4.4","title":"New Antigravity started from a grid: first frame clean","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The grid-born case for agy.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 4.3 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Repeat 4.3 with \u003cstrong>Antigravity\u003c/strong> labelled \u003ccode>grid-born-agy\u003c/code>, also in \u003cstrong>quay-uat-p\u003c/strong>.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> agy fills the full pane width with a clean screen.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> As in 4.3.\n\u003c/li>\n\u003c/ul>"},{"id":"4.5","title":"New Codex started from a grid: first frame clean","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The grid-born case for Codex.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 4.4 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Repeat 4.3 with \u003cstrong>Codex\u003c/strong> labelled \u003ccode>grid-born-codex\u003c/code>, also in \u003cstrong>quay-uat-p\u003c/strong>.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Codex fills the full pane width with a clean screen.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> As in 4.3.\n\u003c/li>\n\u003c/ul>"}]},{"id":"5","title":"Resizing","tests":[{"id":"5.1","title":"Splitting side by side","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Claude redraws cleanly when its pane halves in width.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> Section 4 done. Single pane showing \u003ccode>first-A\u003c/code>.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> in the top bar. Using the pane-header dropdowns, put \u003ccode>first-A\u003c/code> in the left pane and \u003ccode>ps-1\u003c/code> in the right pane. Wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Both panes are clean, and Claude's input box fits the left pane.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints). Try Redraw and note the result.\n\u003c/li>\n\u003c/ul>"},{"id":"5.2","title":"Dragging the divider slowly","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A slow drag across the whole range.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.1 answered, still split.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Drag the divider slowly from the far left (20%) to the far right (80%) over about 5 seconds, release, and wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Both panes are clean after the wait.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Also note what you saw during the drag.\n\u003c/li>\n\u003c/ul>"},{"id":"5.3","title":"Dragging the divider fast, back and forth","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A burst of many resizes.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.2 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Drag the divider quickly left and right for about 5 seconds, release near the middle, and wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Both panes are clean after the wait.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints). Note whether Redraw fixes it.\n\u003c/li>\n\u003c/ul>"},{"id":"5.4","title":"Stacked split","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Halving the height rather than the width.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.3 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>Stacked Split (Ctrl+B \")\u003c/strong> with \u003ccode>first-A\u003c/code> on top and \u003ccode>ps-1\u003c/code> below. Wait 3 seconds.\n\u003c/li>\n\u003cli>Drag the horizontal divider to about 30%, release, and wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Both panes are clean after each wait.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note which step.\n\u003c/li>\n\u003c/ul>"},{"id":"5.5","title":"Resize while Claude is streaming a reply","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A resize in the middle of a stream of output.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.4 answered. Side-by-side split with \u003ccode>first-A\u003c/code> left.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>In \u003ccode>first-A\u003c/code> send \u003ccode>Write 60 numbered lines, each a short sentence about the sea\u003c/code>.\n\u003c/li>\n\u003cli>While the reply is still arriving, drag the divider to 30%, then to 70%.\n\u003c/li>\n\u003cli>Wait until the reply finishes, plus 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The finished reply reads cleanly with no repeated or overlapping lines, and the input box is intact.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note the first damaged line number.\n\u003c/li>\n\u003c/ul>"},{"id":"5.6","title":"Maximise and restore the window","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A large width change in one step. On a wide monitor this also crosses the widths where Claude docks its side panes (110 and 144 columns).\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.5 answered. Single pane showing \u003ccode>first-A\u003c/code>.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Run PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints), and note \u003ccode>cols\u003c/code>.\n\u003c/li>\n\u003cli>Maximise the Quay window, wait 3 seconds, and run PROBE again.\n\u003c/li>\n\u003cli>Restore the window, wait 3 seconds, and run PROBE again.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Claude is clean after each wait, and PROBE shows \u003ccode>ok: true\u003c/code> each time. Put all three \u003ccode>cols\u003c/code> values in Notes, even on Pass.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note whether the damage came on maximising or on restoring.\n\u003c/li>\n\u003c/ul>"},{"id":"5.7","title":"Snap the window to half the screen","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Windows snap resizing.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.6 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click the Quay window, press \u003ccode>Win\u003c/code>+\u003ccode>Left\u003c/code>, and wait 3 seconds.\n\u003c/li>\n\u003cli>Press \u003ccode>Win\u003c/code>+\u003ccode>Up\u003c/code> (or drag it back) to restore, and wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Claude is clean after each wait.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints).\n\u003c/li>\n\u003c/ul>"},{"id":"5.8","title":"Drag the window edge","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A continuous resize from the window frame.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.7 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Drag the right edge of the Quay window inward by about a third, then back out, in one slow movement. Release and wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Claude is clean.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints).\n\u003c/li>\n\u003c/ul>"},{"id":"5.9","title":"Minimise and restore","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Hiding the window completely and bringing it back.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.8 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Minimise Quay, wait 10 seconds, and restore it from the taskbar. Wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Claude is clean and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints) shows \u003ccode>ok: true\u003c/code>.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms and PROBE.\n\u003c/li>\n\u003c/ul>"},{"id":"5.10","title":"Drag the rail width","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Resizing the sidebar changes the stage width.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.9 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Drag the rail's right edge (tooltip \u003cstrong>Drag to resize sidebar (Double click to reset)\u003c/strong>) as far right as it goes, release, and wait 3 seconds.\n\u003c/li>\n\u003cli>Double-click the same edge to reset it, and wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Claude is clean after each wait.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note which step.\n\u003c/li>\n\u003c/ul>"},{"id":"5.11","title":"Focus switching that shows or hides the skip-permissions banner","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The red \u003cstrong>Dangerously Skipping Permissions\u003c/strong> banner above the panes appears only while a skip-mode agent pane is focused, so clicking between panes changes the stage height.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.10 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> and use the pane-header dropdowns to put \u003ccode>first-A\u003c/code> left and \u003ccode>ps-1\u003c/code> right. Click inside \u003ccode>first-A\u003c/code> and confirm the banner is showing.\n\u003c/li>\n\u003cli>Click inside \u003ccode>ps-1\u003c/code> (the banner disappears) and wait 3 seconds.\n\u003c/li>\n\u003cli>Click inside \u003ccode>first-A\u003c/code> (the banner returns) and wait 3 seconds. Repeat steps 2 and 3 twice more.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Both panes are clean after every wait, and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints) shows \u003ccode>ok: true\u003c/code> for both.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record PROBE right after a switch, and say which pane was damaged.\n\u003c/li>\n\u003c/ul>"},{"id":"5.12","title":"2×2 grid with four different agents","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Four agents resized into quarters at once.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.11 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>2x2 Grid Layout\u003c/strong> and put \u003ccode>first-A\u003c/code>, \u003ccode>rebuild-C\u003c/code>, \u003ccode>grid-born-agy\u003c/code> and \u003ccode>grid-born-codex\u003c/code> in the four slots. Wait 5 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> All four panes are clean, and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints) shows \u003ccode>ok: true\u003c/code> for all four.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Name the damaged pane or panes.\n\u003c/li>\n\u003c/ul>"},{"id":"5.13","title":"Zoom a grid pane and restore","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Going from a quarter to the full stage and back.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.12 answered, grid showing.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click inside \u003ccode>first-A\u003c/code>, then click \u003cstrong>Zoom active pane (Ctrl+B z)\u003c/strong> in the top bar. Wait 3 seconds.\n\u003c/li>\n\u003cli>Click \u003cstrong>Restore split layout (Ctrl+B z)\u003c/strong>. Wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> \u003ccode>first-A\u003c/code> is clean zoomed, and all four panes are clean after restoring.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note which step and which pane.\n\u003c/li>\n\u003c/ul>"},{"id":"5.14","title":"A hidden terminal resized while hidden","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A pane hidden during a window resize must catch up when shown.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.13 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong> and show \u003ccode>ps-1\u003c/code> (so \u003ccode>first-A\u003c/code> is hidden).\n\u003c/li>\n\u003cli>Maximise the window and wait 3 seconds.\n\u003c/li>\n\u003cli>Click \u003ccode>first-A\u003c/code> in the rail and wait 3 seconds.\n\u003c/li>\n\u003cli>Restore the window.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> \u003ccode>first-A\u003c/code> is clean at step 3, and again after step 4.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints) at step 3.\n\u003c/li>\n\u003c/ul>"},{"id":"5.15","title":"Redraw on a clean Claude pane (config A) keeps it clean","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The Redraw button itself must not damage a fullscreen Claude pane.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.14 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> and use the pane-header dropdowns to put \u003ccode>first-A\u003c/code> left and \u003ccode>ps-1\u003c/code> right. Wait 3 seconds.\n\u003c/li>\n\u003cli>Click \u003cstrong>Redraw terminal screen (Ctrl+L)\u003c/strong> in the \u003ccode>first-A\u003c/code> pane header. Wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Claude's screen is redrawn whole and clean, and the input box still works.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms.\n\u003c/li>\n\u003c/ul>"},{"id":"5.16","title":"Redraw on a main-screen Claude pane (config C) keeps the transcript","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Redraw should repaint the screen without erasing the conversation.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 5.15 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Use the left pane dropdown to show \u003ccode>rebuild-C\u003c/code>. Scroll up and confirm the numbers 1 to 60 are there.\n\u003c/li>\n\u003cli>Click \u003cstrong>Redraw terminal screen (Ctrl+L)\u003c/strong> in its header and wait 3 seconds. Scroll up.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The earlier transcript (the numbers) is still in the pane's scrollback, and the current screen is clean.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Say whether the transcript was erased completely or only damaged.\n\u003c/li>\n\u003c/ul>"}]},{"id":"6","title":"Claude Code mods and layout","tests":[{"id":"6.1","title":"Resize recipe in config A (mods on, fullscreen)","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The full resize recipe in your normal Claude setup.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> Section 5 done. Close every Claude terminal so the rail is clear.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>mods-A\u003c/code>, leaving \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> empty (config A). Wait until ready. Send \u003ccode>Reply with only the word ready\u003c/code>.\n\u003c/li>\n\u003cli>Run the resize recipe on \u003ccode>mods-A\u003c/code>, checking that it is clean after every wait:\n\u003cul>\n\u003cli>\u003cstrong>R1:\u003c/strong> click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> in the top bar. Using the dropdowns in the pane headers, put \u003ccode>mods-A\u003c/code> in the left pane and \u003ccode>ps-1\u003c/code> in the right pane. Wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R2:\u003c/strong> drag the divider between the panes to about 30%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R3:\u003c/strong> drag it to about 70%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R4:\u003c/strong> click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong> so \u003ccode>mods-A\u003c/code> fills the stage, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R5:\u003c/strong> maximise the Quay window, wait 3 seconds, then restore it and wait 3 seconds.\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> \u003ccode>mods-A\u003c/code> is clean after every step.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note the first step that garbled.\n\u003c/li>\n\u003c/ul>"},{"id":"6.2","title":"Resize recipe in config B (mods on, main screen)","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Same mods, other layout.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 6.1 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>mods-B\u003c/code>, with \u003ccode>--settings {\"tui\":\"default\"}\u003c/code> typed into \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> (config B). Wait until ready. Send \u003ccode>Reply with only the word ready\u003c/code>.\n\u003c/li>\n\u003cli>Run the resize recipe on \u003ccode>mods-B\u003c/code>, checking that it is clean after every wait:\n\u003cul>\n\u003cli>\u003cstrong>R1:\u003c/strong> click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> in the top bar. Using the dropdowns in the pane headers, put \u003ccode>mods-B\u003c/code> in the left pane and \u003ccode>ps-1\u003c/code> in the right pane. Wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R2:\u003c/strong> drag the divider between the panes to about 30%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R3:\u003c/strong> drag it to about 70%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R4:\u003c/strong> click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong> so \u003ccode>mods-B\u003c/code> fills the stage, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R5:\u003c/strong> maximise the Quay window, wait 3 seconds, then restore it and wait 3 seconds.\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> \u003ccode>mods-B\u003c/code> is clean after every step.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note the first step that garbled.\n\u003c/li>\n\u003c/ul>"},{"id":"6.3","title":"Resize recipe in config C (mods off, main screen)","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> No mods, main screen.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 6.2 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>mods-C\u003c/code>, with \u003ccode>--safe-mode\u003c/code> typed into \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> (config C). Wait until ready. Send \u003ccode>Reply with only the word ready\u003c/code>.\n\u003c/li>\n\u003cli>Run the resize recipe on \u003ccode>mods-C\u003c/code>, checking that it is clean after every wait:\n\u003cul>\n\u003cli>\u003cstrong>R1:\u003c/strong> click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> in the top bar. Using the dropdowns in the pane headers, put \u003ccode>mods-C\u003c/code> in the left pane and \u003ccode>ps-1\u003c/code> in the right pane. Wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R2:\u003c/strong> drag the divider between the panes to about 30%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R3:\u003c/strong> drag it to about 70%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R4:\u003c/strong> click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong> so \u003ccode>mods-C\u003c/code> fills the stage, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R5:\u003c/strong> maximise the Quay window, wait 3 seconds, then restore it and wait 3 seconds.\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> \u003ccode>mods-C\u003c/code> is clean after every step.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note the first step that garbled.\n\u003c/li>\n\u003c/ul>"},{"id":"6.4","title":"Resize recipe in config D (mods off, fullscreen)","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> No mods, fullscreen.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 6.3 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>quay-uat-p\u003c/strong> in the rail, then start \u003cstrong>Claude\u003c/strong> labelled \u003ccode>mods-D\u003c/code>, with \u003ccode>--safe-mode --settings {\"tui\":\"fullscreen\"}\u003c/code> typed into \u003cstrong>Custom CLI Arguments (Optional)\u003c/strong> (config D). Wait until ready. Send \u003ccode>Reply with only the word ready\u003c/code>.\n\u003c/li>\n\u003cli>Run the resize recipe on \u003ccode>mods-D\u003c/code>, checking that it is clean after every wait:\n\u003cul>\n\u003cli>\u003cstrong>R1:\u003c/strong> click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> in the top bar. Using the dropdowns in the pane headers, put \u003ccode>mods-D\u003c/code> in the left pane and \u003ccode>ps-1\u003c/code> in the right pane. Wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R2:\u003c/strong> drag the divider between the panes to about 30%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R3:\u003c/strong> drag it to about 70%, let go, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R4:\u003c/strong> click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong> so \u003ccode>mods-D\u003c/code> fills the stage, and wait 3 seconds.\n\u003c/li>\n\u003cli>\u003cstrong>R5:\u003c/strong> maximise the Quay window, wait 3 seconds, then restore it and wait 3 seconds.\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> \u003ccode>mods-D\u003c/code> is clean after every step.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note the first step that garbled.\n\u003c/li>\n\u003c/ul>"},{"id":"6.5","title":"Side panes docking as the window widens (config A)","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> When the pane passes about 144 columns, mods dock their side panes beside the transcript. The re-layout must draw cleanly.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 6.4 answered. Single pane showing \u003ccode>mods-A\u003c/code>, window at normal size.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Run PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints), and note \u003ccode>cols\u003c/code>.\n\u003c/li>\n\u003cli>Maximise the window, wait 5 seconds, and run PROBE again.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> Claude is clean. Note in Notes whether side panes appeared and the \u003ccode>cols\u003c/code> before and after. If \u003ccode>cols\u003c/code> is still under 144 when maximised, mark \u003cstrong>Not done\u003c/strong> and give the number.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Screenshot it. Say whether the damage is in the transcript, a side pane, or the border between them.\n\u003c/li>\n\u003c/ul>"},{"id":"6.6","title":"Side panes undocking as the window narrows (config A)","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The reverse re-layout.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 6.5 answered, window maximised.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>Side-by-Side Split (Ctrl+B %)\u003c/strong> with \u003ccode>mods-A\u003c/code> on the left, so its pane drops well below 110 columns. Wait 5 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The side panes are gone or moved inline, and the pane is clean.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> As in 6.5.\n\u003c/li>\n\u003c/ul>"},{"id":"6.7","title":"The hud lines animating for two minutes, visible","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The hud mod redraws its two lines all the time. Damage must not build up over time.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 6.6 answered. Split, \u003ccode>mods-A\u003c/code> left and visible.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Leave Quay alone for 2 minutes while watching \u003ccode>mods-A\u003c/code>.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> After 2 minutes the hud lines and the input box are exactly where they started, with nothing duplicated or smeared.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note roughly when the damage first appeared.\n\u003c/li>\n\u003c/ul>"},{"id":"6.8","title":"The hud lines animating for two minutes, hidden","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A pane that kept animating while hidden must be clean when shown again.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 6.7 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Click \u003cstrong>Single Pane (Ctrl+B x)\u003c/strong> and show \u003ccode>ps-1\u003c/code>, so \u003ccode>mods-A\u003c/code> is hidden.\n\u003c/li>\n\u003cli>Wait 2 minutes, then click \u003ccode>mods-A\u003c/code> in the rail and wait 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> \u003ccode>mods-A\u003c/code> is clean.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Record the symptoms and PROBE (press \u003ccode>F12\u003c/code> if DevTools is closed, click the \u003cstrong>Console\u003c/strong> tab, press the up arrow until the snippet from test 1.5 shows, press Enter, and copy the last line it prints).\n\u003c/li>\n\u003c/ul>"},{"id":"6.9","title":"Quick-reply band appearing and disappearing","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> A band that appears above the prompt changes how many rows the transcript gets.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 6.8 answered, \u003ccode>mods-A\u003c/code> showing.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Send \u003ccode>Ask me one yes-or-no question and wait for my answer\u003c/code>. Wait for the question; a row of reply buttons should appear above the prompt.\n\u003c/li>\n\u003cli>Answer \u003ccode>yes\u003c/code> and wait for the reply, plus 3 seconds.\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The pane is clean while the band shows and after it goes. If no band appeared, mark \u003cstrong>Not done\u003c/strong> and say so.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Note whether the damage came when the band appeared or when it left.\n\u003c/li>\n\u003c/ul>"}]},{"id":"7","title":"Character widths","tests":[{"id":"7.1","title":"Emoji with a variation selector take two columns","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> \u003ccode>⚙️\u003c/code> (a gear followed by an invisible width marker) must take two columns, as agents assume.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> Section 6 done. Show \u003ccode>ps-1\u003c/code>.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Run: \u003ccode>\"$([char]0x2699)$([char]0xFE0F)\" * 5 + '|'; '0123456789|'\u003c/code>\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The two \u003ccode>|\u003c/code> characters line up in the same column, one directly above the other.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> Screenshot it, and say whether the top \u003ccode>|\u003c/code> is to the left or right of the bottom one.\n\u003c/li>\n\u003c/ul>"},{"id":"7.2","title":"Pictographic emoji take two columns","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> The same check for a plain emoji.\n\u003c/li>\n\u003cli>\u003cstrong>Before you start:\u003c/strong> 7.1 answered.\n\u003c/li>\n\u003cli>\u003cstrong>Steps:\u003c/strong>\n\u003col>\n\u003cli>Run: \u003ccode>[char]::ConvertFromUtf32(0x1F642) * 5 + '|'; '0123456789|'\u003c/code>\n\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>PASS looks like:\u003c/strong> The two \u003ccode>|\u003c/code> characters line up.\n\u003c/li>\n\u003cli>\u003cstrong>If it does not work:\u003c/strong> As in 7.1.\n\u003c/li>\n\u003c/ul>"},{"id":"7.3","title":"Emoji in a Claude reply do not shift Claude's layout","url":"","body":"\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> Width disagreements show up as shifted borders after emoji appear.\n\u003c/li>\n\u003cli>\u003cstrong>Before you sta
