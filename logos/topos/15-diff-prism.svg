<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" role="img" aria-labelledby="tp15-title tp15-desc">
  <title id="tp15-title">Topos Git Cockpit: Diff Prism</title>
  <desc id="tp15-desc">A multifaceted crystal prism splitting an incoming commit ray into three distinct diff streams.</desc>
  <g id="tp15-icon"><polygon points="48,18 74,66 22,66" fill="#1E293B" opacity="0.1"/><polygon points="48,18 74,66 22,66" fill="none" stroke="#1E293B" stroke-width="5" stroke-linejoin="round"/><line x1="48" y1="18" x2="48" y2="66" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="3 3"/><line x1="48" y1="18" x2="34" y2="66" stroke="#06B6D4" stroke-width="3"/><line x1="48" y1="18" x2="62" y2="66" stroke="#10B981" stroke-width="3"/><circle cx="48" cy="18" r="7" fill="#F59E0B"/><circle cx="22" cy="66" r="6" fill="#06B6D4"/><circle cx="48" cy="66" r="6" fill="#8B5CF6"/><circle cx="74" cy="66" r="6" fill="#10B981"/></g>
  <g id="tp15-wordmark">
    <text x="110" y="54" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="#0F172A">TOPOS</text>
    <text x="112" y="74" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#06B6D4">GIT COCKPIT</text>
  </g>
</svg>
