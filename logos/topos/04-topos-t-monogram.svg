<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" role="img" aria-labelledby="tp04-title tp04-desc">
  <title id="tp04-title">Topos Git Cockpit: Topos T Monogram</title>
  <desc id="tp04-desc">A bold modern letter T formed by branching lanes that curve outward and snap into a topological grid.</desc>
  <g id="tp04-icon"><rect x="16" y="20" width="64" height="12" rx="6" fill="#1E293B"/><path d="M 48 26 L 48 78" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/><path d="M 48 42 C 48 56, 68 60, 68 76" fill="none" stroke="#06B6D4" stroke-width="5" stroke-linecap="round"/><circle cx="22" cy="26" r="5" fill="#8B5CF6"/><circle cx="74" cy="26" r="5" fill="#06B6D4"/><circle cx="48" cy="76" r="8" fill="#10B981"/><circle cx="48" cy="76" r="4" fill="#FFFFFF"/><circle cx="68" cy="76" r="6" fill="#06B6D4"/></g>
  <g id="tp04-wordmark">
    <text x="110" y="54" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="#0F172A">TOPOS</text>
    <text x="112" y="74" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#06B6D4">GIT COCKPIT</text>
  </g>
</svg>
