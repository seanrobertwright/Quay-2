<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" role="img" aria-labelledby="px01-title px01-desc">
  <title id="px01-title">Praxis workflow engine logo: Deliverable Gate</title>
  <desc id="px01-desc">A classical gateway with a gold deliverable passing between the pillars. Work moves only when the gate opens.</desc>
  <g id="px01-icon"><rect x="12" y="14" width="72" height="10" rx="2" fill="#1E2A4A"/><rect x="20" y="28" width="12" height="54" rx="1.5" fill="#1E2A4A"/><rect x="64" y="28" width="12" height="54" rx="1.5" fill="#1E2A4A"/><rect x="40" y="47" width="16" height="16" rx="2" transform="rotate(45 48 55)" fill="#C9A227"/></g>
  <g id="px01-wordmark">
    <text x="114" y="54" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="38" font-weight="600" letter-spacing="5" fill="#1E2A4A">PRAXIS</text>
    <text x="116" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2" fill="#C9A227">WORKFLOW ENGINE</text>
  </g>
</svg>
