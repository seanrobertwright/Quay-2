<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis Logo Concepts</title>
  <style>
    :root { --bg: #F4F4F5; --card: #FFFFFF; --ink: #18181B; --muted: #52525B; --line: #E4E4E7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--ink);
           font: 15px/1.5 'Segoe UI', system-ui, sans-serif; }
    h1 { margin: 0 auto 4px; max-width: 1200px; font-weight: 600; }
    p.lede { margin: 0 auto 24px; max-width: 1200px; color: var(--muted); }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px;
           max-width: 1200px; margin: 0 auto; }
    .card { margin: 0; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    .lockup { display: block; width: 100%; height: auto; }
    .sizes { display: flex; align-items: center; gap: 16px; margin: 12px 0; padding-top: 12px;
             border-top: 1px solid var(--line); }
    figcaption { color: var(--muted); font-size: 13px; }
    figcaption strong { display: block; color: var(--ink); font-size: 15px; }
  </style>
</head>
<body>
  <h1>Praxis logo concepts</h1>
  <p class="lede">Each card shows the horizontal lockup, then the icon at 64, 32 and 16 pixels.</p>
  <main>
    <figure class="card">
      <img class="lockup" src="01-gate.svg" alt="Praxis Deliverable Gate lockup">
      <div class="sizes">
        <img src="icons/01-gate.svg" width="64" height="64" alt="Deliverable Gate icon at 64 pixels">
        <img src="icons/01-gate.svg" width="32" height="32" alt="Deliverable Gate icon at 32 pixels">
        <img src="icons/01-gate.svg" width="16" height="16" alt="Deliverable Gate icon at 16 pixels">
      </div>
      <figcaption><strong>01. Deliverable Gate</strong> A classical gateway with a gold deliverable passing between the pillars. Work moves only when the gate opens.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="02-state-machine.svg" alt="Praxis State Machine lockup">
      <div class="sizes">
        <img src="icons/02-state-machine.svg" width="64" height="64" alt="State Machine icon at 64 pixels">
        <img src="icons/02-state-machine.svg" width="32" height="32" alt="State Machine icon at 32 pixels">
        <img src="icons/02-state-machine.svg" width="16" height="16" alt="State Machine icon at 16 pixels">
      </div>
      <figcaption><strong>02. State Machine</strong> Three states in a closed cycle, one of them active. Praxis runs on deterministic transitions.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="03-pipeline.svg" alt="Praxis Stage Pipeline lockup">
      <div class="sizes">
        <img src="icons/03-pipeline.svg" width="64" height="64" alt="Stage Pipeline icon at 64 pixels">
        <img src="icons/03-pipeline.svg" width="32" height="32" alt="Stage Pipeline icon at 32 pixels">
        <img src="icons/03-pipeline.svg" width="16" height="16" alt="Stage Pipeline icon at 16 pixels">
      </div>
      <figcaption><strong>03. Stage Pipeline</strong> Four chevrons darkening left to right: Spec, Design, Code, Verify.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="04-pi-monogram.svg" alt="Praxis Classical Monogram lockup">
      <div class="sizes">
        <img src="icons/04-pi-monogram.svg" width="64" height="64" alt="Classical Monogram icon at 64 pixels">
        <img src="icons/04-pi-monogram.svg" width="32" height="32" alt="Classical Monogram icon at 32 pixels">
        <img src="icons/04-pi-monogram.svg" width="16" height="16" alt="Classical Monogram icon at 16 pixels">
      </div>
      <figcaption><strong>04. Classical Monogram</strong> A serifed P in a double gold ring. Praxis is the Greek word for action put into practice.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="05-machina-gear.svg" alt="Praxis Machina Gear lockup">
      <div class="sizes">
        <img src="icons/05-machina-gear.svg" width="64" height="64" alt="Machina Gear icon at 64 pixels">
        <img src="icons/05-machina-gear.svg" width="32" height="32" alt="Machina Gear icon at 32 pixels">
        <img src="icons/05-machina-gear.svg" width="16" height="16" alt="Machina Gear icon at 16 pixels">
      </div>
      <figcaption><strong>05. Machina Gear</strong> A factory gear with a run button at its hub: the machine that executes the work.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="06-hold.svg" alt="Praxis Human Hold lockup">
      <div class="sizes">
        <img src="icons/06-hold.svg" width="64" height="64" alt="Human Hold icon at 64 pixels">
        <img src="icons/06-hold.svg" width="32" height="32" alt="Human Hold icon at 32 pixels">
        <img src="icons/06-hold.svg" width="16" height="16" alt="Human Hold icon at 16 pixels">
      </div>
      <figcaption><strong>06. Human Hold</strong> The amber HOLD state: a pause inside a hexagon, where a person ratifies before work resumes.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="07-work-order.svg" alt="Praxis Work Order lockup">
      <div class="sizes">
        <img src="icons/07-work-order.svg" width="64" height="64" alt="Work Order icon at 64 pixels">
        <img src="icons/07-work-order.svg" width="32" height="32" alt="Work Order icon at 32 pixels">
        <img src="icons/07-work-order.svg" width="16" height="16" alt="Work Order icon at 16 pixels">
      </div>
      <figcaption><strong>07. Work Order</strong> A perforated ticket with a check: every job in Praxis starts as a formal work order.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="08-fork-join.svg" alt="Praxis Fork and Join lockup">
      <div class="sizes">
        <img src="icons/08-fork-join.svg" width="64" height="64" alt="Fork and Join icon at 64 pixels">
        <img src="icons/08-fork-join.svg" width="32" height="32" alt="Fork and Join icon at 32 pixels">
        <img src="icons/08-fork-join.svg" width="16" height="16" alt="Fork and Join icon at 16 pixels">
      </div>
      <figcaption><strong>08. Fork and Join</strong> A graph that splits into parallel branches and joins at one highlighted result.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="09-hive.svg" alt="Praxis Worker Hive lockup">
      <div class="sizes">
        <img src="icons/09-hive.svg" width="64" height="64" alt="Worker Hive icon at 64 pixels">
        <img src="icons/09-hive.svg" width="32" height="32" alt="Worker Hive icon at 32 pixels">
        <img src="icons/09-hive.svg" width="16" height="16" alt="Worker Hive icon at 16 pixels">
      </div>
      <figcaption><strong>09. Worker Hive</strong> Six worker cells around one coordinating core: agents dispatched by a single engine.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="10-continuum.svg" alt="Praxis Continuum lockup">
      <div class="sizes">
        <img src="icons/10-continuum.svg" width="64" height="64" alt="Continuum icon at 64 pixels">
        <img src="icons/10-continuum.svg" width="32" height="32" alt="Continuum icon at 32 pixels">
        <img src="icons/10-continuum.svg" width="16" height="16" alt="Continuum icon at 16 pixels">
      </div>
      <figcaption><strong>10. Continuum</strong> A gradient infinity loop for long-running, resumable workflows.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="11-flywheel.svg" alt="Praxis Flywheel lockup">
      <div class="sizes">
        <img src="icons/11-flywheel.svg" width="64" height="64" alt="Flywheel icon at 64 pixels">
        <img src="icons/11-flywheel.svg" width="32" height="32" alt="Flywheel icon at 32 pixels">
        <img src="icons/11-flywheel.svg" width="16" height="16" alt="Flywheel icon at 16 pixels">
      </div>
      <figcaption><strong>11. Flywheel</strong> Three interlocking chevron segments turning one way: momentum from repeatable process.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="12-circuit.svg" alt="Praxis Circuit Trace lockup">
      <div class="sizes">
        <img src="icons/12-circuit.svg" width="64" height="64" alt="Circuit Trace icon at 64 pixels">
        <img src="icons/12-circuit.svg" width="32" height="32" alt="Circuit Trace icon at 32 pixels">
        <img src="icons/12-circuit.svg" width="16" height="16" alt="Circuit Trace icon at 16 pixels">
      </div>
      <figcaption><strong>12. Circuit Trace</strong> A P routed as a gold trace on a circuit board, with pads at each terminal.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="13-laurel.svg" alt="Praxis Laurel lockup">
      <div class="sizes">
        <img src="icons/13-laurel.svg" width="64" height="64" alt="Laurel icon at 64 pixels">
        <img src="icons/13-laurel.svg" width="32" height="32" alt="Laurel icon at 32 pixels">
        <img src="icons/13-laurel.svg" width="16" height="16" alt="Laurel icon at 16 pixels">
      </div>
      <figcaption><strong>13. Laurel</strong> A serif P inside laurel branches. Classical, ceremonial, a mark of work well done.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="14-draftsman.svg" alt="Praxis Draftsman lockup">
      <div class="sizes">
        <img src="icons/14-draftsman.svg" width="64" height="64" alt="Draftsman icon at 64 pixels">
        <img src="icons/14-draftsman.svg" width="32" height="32" alt="Draftsman icon at 32 pixels">
        <img src="icons/14-draftsman.svg" width="16" height="16" alt="Draftsman icon at 16 pixels">
      </div>
      <figcaption><strong>14. Draftsman</strong> A drafting compass scribing an arc: the architecture stage, where contracts are drawn first.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="15-blueprint.svg" alt="Praxis Blueprint lockup">
      <div class="sizes">
        <img src="icons/15-blueprint.svg" width="64" height="64" alt="Blueprint icon at 64 pixels">
        <img src="icons/15-blueprint.svg" width="32" height="32" alt="Blueprint icon at 32 pixels">
        <img src="icons/15-blueprint.svg" width="16" height="16" alt="Blueprint icon at 16 pixels">
      </div>
      <figcaption><strong>15. Blueprint</strong> A P drawn on a blueprint grid with its construction circle still visible.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="16-ratified-seal.svg" alt="Praxis Ratified Seal lockup">
      <div class="sizes">
        <img src="icons/16-ratified-seal.svg" width="64" height="64" alt="Ratified Seal icon at 64 pixels">
        <img src="icons/16-ratified-seal.svg" width="32" height="32" alt="Ratified Seal icon at 32 pixels">
        <img src="icons/16-ratified-seal.svg" width="16" height="16" alt="Ratified Seal icon at 16 pixels">
      </div>
      <figcaption><strong>16. Ratified Seal</strong> A stamped seal with the engine's full name around a check: approved, signed off, released.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="17-origami.svg" alt="Praxis Folded P lockup">
      <div class="sizes">
        <img src="icons/17-origami.svg" width="64" height="64" alt="Folded P icon at 64 pixels">
        <img src="icons/17-origami.svg" width="32" height="32" alt="Folded P icon at 32 pixels">
        <img src="icons/17-origami.svg" width="16" height="16" alt="Folded P icon at 16 pixels">
      </div>
      <figcaption><strong>17. Folded P</strong> A P folded from six faceted planes, with a triangular counter.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="18-single-path.svg" alt="Praxis Single Path lockup">
      <div class="sizes">
        <img src="icons/18-single-path.svg" width="64" height="64" alt="Single Path icon at 64 pixels">
        <img src="icons/18-single-path.svg" width="32" height="32" alt="Single Path icon at 32 pixels">
        <img src="icons/18-single-path.svg" width="16" height="16" alt="Single Path icon at 16 pixels">
      </div>
      <figcaption><strong>18. Single Path</strong> One unbroken line spirals into a P and ends on a red point: one deterministic path to done.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="19-keystone.svg" alt="Praxis Keystone lockup">
      <div class="sizes">
        <img src="icons/19-keystone.svg" width="64" height="64" alt="Keystone icon at 64 pixels">
        <img src="icons/19-keystone.svg" width="32" height="32" alt="Keystone icon at 32 pixels">
        <img src="icons/19-keystone.svg" width="16" height="16" alt="Keystone icon at 16 pixels">
      </div>
      <figcaption><strong>19. Keystone</strong> An arch held by a gold keystone. Invariants are the stone that keeps the structure standing.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="20-console.svg" alt="Praxis Console lockup">
      <div class="sizes">
        <img src="icons/20-console.svg" width="64" height="64" alt="Console icon at 64 pixels">
        <img src="icons/20-console.svg" width="32" height="32" alt="Console icon at 32 pixels">
        <img src="icons/20-console.svg" width="16" height="16" alt="Console icon at 16 pixels">
      </div>
      <figcaption><strong>20. Console</strong> A terminal prompt and cursor. Praxis is scriptable from the command line.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="21-milestones.svg" alt="Praxis Milestones lockup">
      <div class="sizes">
        <img src="icons/21-milestones.svg" width="64" height="64" alt="Milestones icon at 64 pixels">
        <img src="icons/21-milestones.svg" width="32" height="32" alt="Milestones icon at 32 pixels">
        <img src="icons/21-milestones.svg" width="16" height="16" alt="Milestones icon at 16 pixels">
      </div>
      <figcaption><strong>21. Milestones</strong> Rising steps with a flag on the last: milestones reached in order.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="22-constellation.svg" alt="Praxis Constellation lockup">
      <div class="sizes">
        <img src="icons/22-constellation.svg" width="64" height="64" alt="Constellation icon at 64 pixels">
        <img src="icons/22-constellation.svg" width="32" height="32" alt="Constellation icon at 32 pixels">
        <img src="icons/22-constellation.svg" width="16" height="16" alt="Constellation icon at 16 pixels">
      </div>
      <figcaption><strong>22. Constellation</strong> Stars joined into a P across a night sky, one of them gold.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="23-bauhaus.svg" alt="Praxis Bauhaus lockup">
      <div class="sizes">
        <img src="icons/23-bauhaus.svg" width="64" height="64" alt="Bauhaus icon at 64 pixels">
        <img src="icons/23-bauhaus.svg" width="32" height="32" alt="Bauhaus icon at 32 pixels">
        <img src="icons/23-bauhaus.svg" width="16" height="16" alt="Bauhaus icon at 16 pixels">
      </div>
      <figcaption><strong>23. Bauhaus</strong> A P built from primary shapes: bar, half disc, dot and triangle.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="24-prism.svg" alt="Praxis Prism lockup">
      <div class="sizes">
        <img src="icons/24-prism.svg" width="64" height="64" alt="Prism icon at 64 pixels">
        <img src="icons/24-prism.svg" width="32" height="32" alt="Prism icon at 32 pixels">
        <img src="icons/24-prism.svg" width="16" height="16" alt="Prism icon at 16 pixels">
      </div>
      <figcaption><strong>24. Prism</strong> One beam of intent enters, separate deliverables leave: a single spec fanned into parallel work.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="25-assembly-line.svg" alt="Praxis Assembly Line lockup">
      <div class="sizes">
        <img src="icons/25-assembly-line.svg" width="64" height="64" alt="Assembly Line icon at 64 pixels">
        <img src="icons/25-assembly-line.svg" width="32" height="32" alt="Assembly Line icon at 32 pixels">
        <img src="icons/25-assembly-line.svg" width="16" height="16" alt="Assembly Line icon at 16 pixels">
      </div>
      <figcaption><strong>25. Assembly Line</strong> Finished parts on a conveyor with the next one still dashed: a software factory in motion.</figcaption>
    </figure>
    <figure class="card">
      <img class="lockup" src="26-px-lettermark.svg" alt="Praxis Px Lettermark lockup">
      <div class="sizes">
        <img src="icons/26-px-lettermark.svg" width="64" height="64" alt="Px Lettermark icon at 64 pixels">
        <img src="icons/26-px-lettermark.svg" width="32" height="32" alt="Px Lettermark icon at 32 pixels">
        <img src="icons/26-px-lettermark.svg" width="16" height="16" alt="Px Lettermark icon at 16 pixels">
      </div>
      <figcaption><strong>26. Px Lettermark</strong> An app-icon style P and x in a violet rounded square, for favicons and launchers.</figcaption>
    </figure>
  </main>
</body>
</html>
